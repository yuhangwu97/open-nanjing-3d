<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #f8fafc;

    #canvas-container { width: 100vw; height: 100vh; display: block; }

    /* 毛玻璃面板 */
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    /* 自定义滚动条 */
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.35); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

    /* 路线胶囊按钮 */
    .route-pill {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .route-pill:hover {
      background: rgba(51, 65, 85, 0.95);
      color: #fff;
      border-color: #fbbf24;
    }
    .route-pill.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border-color: #fde68a;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
    }

    /* 环境模式按钮 */
    .env-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .env-btn:hover { background: rgba(51, 65, 85, 0.95); color: #fff; }
    .env-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #93c5fd;
      font-weight: 600;
    }

    /* 面板平滑折叠动画与沉浸模式 */

      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
    }
    .panel-hidden-left {
      transform: translateX(-115%);
      opacity: 0;
      pointer-events: none !important;
    }
    .panel-hidden-right {
      transform: translateX(115%);
      opacity: 0;
      pointer-events: none !important;
    }
    body.immersive-clean #top-header,
    body.immersive-clean #route-panel,
    body.immersive-clean #guide-drawer {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* 子视角切换小按钮 */
    .subview-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .subview-btn:hover {
      background: rgba(51, 65, 85, 1);
      border-color: #fbbf24;
      color: #fff;
    }
    .subview-btn.active {
      background: #2563eb;
      border-color: #93c5fd;
      color: #fff;
    }

    /* 自定义进度滑块 */
    input[type="range"].timeline-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fbbf24;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      cursor: grab;
    }

    /* 3D 沙盘地图交互式地标气泡牌 */
    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 8;
      transition: transform 0.18s ease, opacity 0.18s ease;

    .map-pin:hover {

    }

      backdrop-filter: blur(6px);

      border-radius: 999px;

      align-items: center;
      gap: 4px;

    .map-pin.active .map-pin-inner {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      border-color: #fbbf24;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.6);

    .map-pin-order {

      height: 10px;
      background: linear-gradient(to bottom, #fbbf24, transparent);

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // 1. 全域沙盘 13 大地标坐标系统与中山陵高程函数 (13 Landmarks Sandbox Coordinate System)
    // ============================================================================
    const ZX_OFFSET_X = 525; // 中山陵与紫金山大幅右移至 X = 525, Z = -118，与玄武湖(X=155)和北段长江(Z=-495~-545)拉开充裕距离
    const STAIR_START_Z = -48;
    const STAIR_END_Z = -112;
    const STAIR_START_Y = 4.5;
    const STAIR_END_Y = 28.0;
    const SEGMENTS = 10;
    const SEG_DZ = (STAIR_START_Z - STAIR_END_Z) / SEGMENTS;
    const SEG_DY = (STAIR_END_Y - STAIR_START_Y) / SEGMENTS;
    const STAIR_RUN = 4.4;
    const PLAT_LEN = 2.0;
    const STEPS_PER_SEG = 8;
    const MEILING_CENTER_Z = 82; // 美龄宫右移至 X = 545, Z = 82

    function getAxisElevation(z) {
      if (z >= 8) return 0;
      if (z >= -22) return ((8 - z) / 30) * 2.0;
      if (z >= -32) return 2.0;
      if (z >= -36) return 2.0 + ((-32 - z) / 4) * 2.5;
      if (z >= STAIR_START_Z) return STAIR_START_Y;
      if (z >= STAIR_END_Z) {
        const dist = STAIR_START_Z - z;
        const segIdx = Math.min(SEGMENTS - 1, Math.floor(dist / SEG_DZ));
        const localZ = dist - segIdx * SEG_DZ;
        const baseSegY = STAIR_START_Y + segIdx * SEG_DY;
        if (localZ <= STAIR_RUN) {
          const stepIdx = Math.min(STEPS_PER_SEG, Math.ceil((localZ / STAIR_RUN) * STEPS_PER_SEG));
          return baseSegY + (stepIdx / STEPS_PER_SEG) * SEG_DY;
        }
        return baseSegY + SEG_DY;
      }
      return STAIR_END_Y;
    }

    function getStairHalfWidth(z) {
      const t = THREE.MathUtils.clamp((STAIR_START_Z - z) / (STAIR_START_Z - STAIR_END_Z), 0, 1);
      return 10.5 + Math.pow(t, 1.15) * 9.5;
    }

    // 多频自然山脉分形噪声辅助函数，赋予紫金山真实险峻的山脊线、岩壁冲沟与峰峦起伏
    function ridgeNoise(x, z) {
      const n1 = Math.sin(x * 0.035 + z * 0.028) * Math.cos(x * 0.024 - z * 0.038);
      const n2 = (1.0 - Math.abs(Math.sin(x * 0.065 - z * 0.052))) * 0.65;
      const n3 = Math.sin(x * 0.13 + z * 0.11) * 0.25;
      return n1 * 0.55 + n2 + n3;
    }

    function getPurpleMountainHeight(x, z) {
      // “钟山龙蟠”蜿蜒山脊主脉（整体大幅右移至 X = 395 ~ 645 区间，中心 X = 525, Z = -155）
      let h = 0;

      // 1. 北高峰 / 头陀岭主峰 (X = 528, Z = -192, 峰值 106)
      const dx1 = (x - 528) / 1.25, dz1 = (z - (-192)) / 0.85;
      const r1 = Math.hypot(dx1, dz1);
      h += 102 * Math.exp(-Math.pow(r1 / 56, 1.85));

      // 2. 西峰：第二峰二茅峰 · 紫金山天文台山脊 (X = 442, Z = -148, 峰值 68)
      const dx2 = (x - 442) / 1.15, dz2 = (z - (-148)) / 0.88;
      const r2 = Math.hypot(dx2, dz2);
      h += 66 * Math.exp(-Math.pow(r2 / 46, 1.8));

      // 3. 东峰：第三峰三茅峰与小茅山连绵山脊 (X = 608, Z = -162, 峰值 74)
      const dx3 = (x - 608) / 1.22, dz3 = (z - (-162)) / 0.88;
      const r3 = Math.hypot(dx3, dz3);
      h += 72 * Math.exp(-Math.pow(r3 / 48, 1.8));

      // 4. 东西向连绵龙脊鞍部
      if (x > 405 && x < 645 && z < -85 && z > -245) {
        const spineZ = -165 - Math.sin(((x - 430) / 180) * Math.PI) * 26;
        const distSpine = Math.abs(z - spineZ);
        const alongX = Math.sin(THREE.MathUtils.clamp((x - 405) / 240, 0, 1) * Math.PI);
        h += 32 * alongX * Math.exp(-(distSpine * distSpine) / (2 * 32 * 32));
      }

      if (h > 2.0) {
        const rn = ridgeNoise(x, z);
        const gully = Math.sin((x - 525) * 0.09 + z * 0.04) * Math.cos(z * 0.08);
        h += (rn * 8.5 + gully * 3.8) * Math.min(1.0, h / 28.0);

      if (z > -148 && z < 20 && relX < 54) {
        const stairY = Math.max(0, getAxisElevation(z) - 0.8);
        const innerW = z < -112 ? 25 : getStairHalfWidth(z) + 2.5;
        if (relX <= innerW) {

        } else {
          const blend = THREE.MathUtils.smoothstep(relX, innerW, 54);
          h = THREE.MathUtils.lerp(Math.min(h, stairY + 2.0), h, blend);

          h = THREE.MathUtils.lerp(Math.min(h, 1.0), h, tBlend);
        }
      }

    // 程序化高清摩天楼玻璃幕墙窗格纹理（应用于紫峰大厦、青奥双塔及城市CBD写字楼群，带层间腰线与万家灯火内透）
    function createSkyscraperCurtainWallTexture(glassTop = '#0f2942', glassBot = '#1e3a8a', mullionColor = '#cbd5e1', lightColor = 'rgba(254, 240, 138, 0.78)') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 512, 1024);
      bg.addColorStop(0, glassTop);
      bg.addColorStop(0.5, glassBot);
      bg.addColorStop(1, '#091526');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 512, 1024);

      const cols = 16, rows = 32;
      const cw = 512 / cols, ch = 1024 / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const seed = Math.sin(r * 19.7 + c * 31.3) * 43758.5453;
          const frac = seed - Math.floor(seed);
          if (frac > 0.58) {
            ctx.fillStyle = frac > 0.82 ? lightColor : 'rgba(186, 230, 253, 0.45)';
            ctx.fillRect(c * cw + 3, r * ch + 4, cw - 6, ch - 8);
          } else {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
            ctx.fillRect(c * cw + 2, r * ch + 3, cw - 4, ch - 6);
          }
        }
        // 层间金属腰线 (Floor Spandrel Band)
        ctx.fillStyle = r % 6 === 0 ? '#e2e8f0' : 'rgba(148, 163, 184, 0.55)';
        ctx.fillRect(0, r * ch, 512, r % 6 === 0 ? 4 : 2);
      }

      // 竖向金属窗框龙骨 (Vertical Mullions)
      ctx.strokeStyle = mullionColor;
      ctx.lineWidth = 2;
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath();
        ctx.moveTo(c * cw, 0);
        ctx.lineTo(c * cw, 1024);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    // 程序化高清古建朱红雕花格扇门窗纹理（应用于鸡鸣寺、玄武湖藏经楼、夫子庙等古建群）
    function createAncientLatticeWindowTexture(wallBgHex = '#991b1b', latticeHex = '#7f1d1d', glowHex = '#fef08a') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = wallBgHex;
      ctx.fillRect(0, 0, 512, 256);

      // 上下青石须弥座边线与额枋彩画带
      ctx.fillStyle = '#b45309';
      ctx.fillRect(0, 0, 512, 22);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(0, 20, 512, 5);

      // 4组对开朱红雕花格扇门窗
      const bays = 4;
      const bw = 512 / bays;
      for (let b = 0; b < bays; b++) {
        const x0 = b * bw + 14;
        const w = bw - 28;
        // 内部暖黄宣纸灯火内透
        ctx.fillStyle = glowHex;
        ctx.fillRect(x0, 38, w, 148);

        // 朱红雕花步步锦/菱花窗棂网格
        ctx.strokeStyle = latticeHex;
        ctx.lineWidth = 4;
        ctx.strokeRect(x0, 38, w, 188);
        for (let gx = x0 + 12; gx < x0 + w; gx += 14) {
          ctx.beginPath(); ctx.moveTo(gx, 38); ctx.lineTo(gx, 186); ctx.stroke();
        }
        for (let gy = 54; gy < 186; gy += 16) {
          ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(x0 + w, gy); ctx.stroke();
        }

        // 下部裙板与鎏金雕花绦环板
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(x0, 182, w, 44);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x0 + 8, 188, w - 16, 30);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    // 程序化高清“波光粼粼”动态江水/湖水纹理（带阳光碎金波峰、涟漪波纹与水波高光）
    function createShimmeringWaterTexture(baseTop = '#0369a1', baseBot = '#0284c7', glintColor = 'rgba(254, 249, 195, 0.88)', rippleColor = 'rgba(125, 211, 252, 0.65)') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 512, 512);
      bg.addColorStop(0, baseTop);
      bg.addColorStop(0.5, baseBot);
      bg.addColorStop(1, baseTop);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 512, 512);

      // 绘制交织的波浪涟漪条带
      for (let i = 0; i < 140; i++) {
        const x = (Math.sin(i * 17.3) * 0.5 + 0.5) * 512;
        const y = (Math.cos(i * 31.7) * 0.5 + 0.5) * 512;
        const w = 18 + (i % 5) * 10;
        const h = 2.5 + (i % 3) * 1.5;
        ctx.fillStyle = rippleColor;
        ctx.beginPath();
        ctx.ellipse(x, y, w, h, (i % 3 - 1) * 0.15, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制阳光折射下的“波光粼粼”碎金高光点
      for (let j = 0; j < 95; j++) {
        const gx = (Math.sin(j * 43.1 + 1.7) * 0.5 + 0.5) * 512;
        const gy = (Math.cos(j * 29.3 + 0.9) * 0.5 + 0.5) * 512;
        const gw = 6 + (j % 4) * 5;
        ctx.fillStyle = glintColor;
        ctx.beginPath();
        ctx.ellipse(gx, gy, gw, 1.8, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 4);
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    // 程序化高清明代城墙错缝青砖与沧桑苔痕纹理（彻底告别塑料感假城墙）
    function createMingBrickWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 0, 512, 512);

      const rows = 16, cols = 8;
      const rh = 512 / rows, cw = 512 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let c = -1; c <= cols; c++) {
          const x = c * cw + offset;
          const y = r * rh;
          const shade = 64 + ((r * 7 + c * 13) % 26);
          ctx.fillStyle = `rgb(${shade}, ${shade + 8}, ${shade + 18})`;
          ctx.fillRect(x + 2, y + 2, cw - 4, rh - 4);
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, cw - 2, rh - 2);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 2);
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    function createWutongTree(scale = 1.0, seed = 0) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(sharedGeos.trunkCyl, mats.treeTrunk);
      trunk.position.y = 1.0;
      trunk.castShadow = true;
      tree.add(trunk);

      for (let b = 0; b < 3; b++) {
        const ang = (b / 3) * Math.PI * 2 + seed * 0.7;
        const branch = new THREE.Mesh(sharedGeos.branchCyl, mats.treeTrunk);
        branch.position.set(Math.cos(ang) * 0.32, 2.15, Math.sin(ang) * 0.32);
        branch.rotation.z = -Math.cos(ang) * 0.42;
        branch.rotation.x = Math.sin(ang) * 0.42;
        tree.add(branch);
      }

      const puffOffsets = [
        [0, 3.35, 0, 1.2, 0.9, 1.2],
        [-0.78, 2.9, 0.5, 0.9, 0.78, 0.9],
        [0.78, 2.95, 0.4, 0.92, 0.78, 0.88],
        [0.12, 2.85, -0.82, 0.88, 0.75, 0.9],
        [-0.3, 3.55, -0.22, 0.8, 0.72, 0.8]
      ];
      puffOffsets.forEach(([ox, oy, oz, sx, sy, sz], idx) => {
        const subMat = wutongCrownMats[(seed + idx) % wutongCrownMats.length];
        const puff = new THREE.Mesh(sharedGeos.wutongPuff, subMat);
        puff.position.set(ox, oy, oz);
        puff.scale.set(sx, sy, sz);
        puff.rotation.y = seed + idx;
        puff.castShadow = true;
        tree.add(puff);
      });

      tree.scale.setScalar(scale);
      return tree;
    }

    // 基于三维向量与四元数矩阵对齐的精确引桥生成算法（彻底修正上下桥坡向反置问题，100% 严丝合缝连接桥面与地面）
    function createExactBridgeApproachRamp(pBridge, pGround, opts = {}) {
      const {
        width = 12.6,
        thickness = 1.0,
        deckMat = mats.asphaltRoad,
        railMat = mats.whiteMarble,
        railHeight = 1.2,
        railWidth = 0.45,
        walkwayMat = null,
        walkwayWidth = 3.6,
        pierCount = 3,
        pierRadiusTop = 0.85,
        pierRadiusBot = 1.08
      } = opts;

      const rampGroup = new THREE.Group();
      const vec = new THREE.Vector3().subVectors(pGround, pBridge);
      const slopeLen = vec.length();
      const midPt = new THREE.Vector3().addVectors(pBridge, pGround).multiplyScalar(0.5);

      // 构造右手正交局部坐标系：xAxis 严格沿 pBridge -> pGround 斜向下，zAxis 水平横切桥面，yAxis 垂直坡面向上
      const xAxis = vec.clone().normalize();
      const worldUp = new THREE.Vector3(0, 1, 0);
      const zAxis = new THREE.Vector3().crossVectors(xAxis, worldUp).normalize();
      if (zAxis.lengthSq() < 0.001) zAxis.set(0, 0, 1);
      const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();

      const basisMat = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
      const rampQuat = new THREE.Quaternion().setFromRotationMatrix(basisMat);

      // 斜坡引桥主面板（两端精确贴合 pBridge 与 pGround）
      const deckMesh = new THREE.Mesh(new THREE.BoxGeometry(slopeLen + 0.5, thickness, width), deckMat);
      deckMesh.position.copy(midPt).addScaledVector(yAxis, -thickness * 0.25);
      deckMesh.quaternion.copy(rampQuat);
      deckMesh.castShadow = true;
      deckMesh.receiveShadow = true;
      rampGroup.add(deckMesh);

      if (walkwayMat) {
        const walkMesh = new THREE.Mesh(new THREE.BoxGeometry(slopeLen + 0.5, 0.16, walkwayWidth), walkwayMat);
        walkMesh.position.copy(midPt).addScaledVector(yAxis, thickness * 0.28);
        walkMesh.quaternion.copy(rampQuat);
        rampGroup.add(walkMesh);
      }

      // 两侧贴合坡向的引桥护栏
      [-width * 0.5 + railWidth * 0.5, width * 0.5 - railWidth * 0.5].forEach(latZ => {
        const railMesh = new THREE.Mesh(new THREE.BoxGeometry(slopeLen + 0.4, railHeight, railWidth), railMat);
        railMesh.position.copy(midPt)
          .addScaledVector(zAxis, latZ)
          .addScaledVector(yAxis, railHeight * 0.48);
        railMesh.quaternion.copy(rampQuat);
        rampGroup.add(railMesh);
      });

      // 沿坡向渐低排列的垂直桥墩与桥台
      for (let k = 1; k <= pierCount; k++) {
        const u = k / (pierCount + 1);
        const ptOnSlope = new THREE.Vector3().lerpVectors(pBridge, pGround, u);
        const pierH = Math.max(0.6, ptOnSlope.y - pGround.y + 0.3);
        const latList = width > 8.5 ? [-width * 0.3, width * 0.3] : [0];
        latList.forEach(lat => {
          const pier = new THREE.Mesh(
            new THREE.CylinderGeometry(pierRadiusTop, pierRadiusBot, pierH, 12),
            mats.whiteMarble
          );
          pier.position.copy(ptOnSlope).addScaledVector(zAxis, lat);
          pier.position.y = pGround.y + pierH * 0.5 - 0.25;
          pier.castShadow = true;
          rampGroup.add(pier);
        });
      }

      const horizDir = new THREE.Vector3(vec.x, 0, vec.z).normalize();
      const abutQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), horizDir);
      const abut = new THREE.Mesh(new THREE.BoxGeometry(5.8, 1.8, width + 1.2), mats.mingStoneBase);
      abut.position.copy(pGround);
      abut.position.y = pGround.y - 0.15;
      abut.quaternion.copy(abutQuat);
      rampGroup.add(abut);

      return rampGroup;
    }

    function createChineseRoof(width, depth, height, tileMat, withGoldRidge = true) {
      const group = new THREE.Group();
      // 额枋斗拱铺作垫层 (Dougong Eave Bracket Frieze)
      const dougongBelt = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.92, Math.max(0.22, height * 0.14), depth * 0.92),
        mats.vermilionRed
      );
      dougongBelt.position.y = height * 0.05;
      group.add(dougongBelt);

      // 飞檐裙边（四角带微微上翘反宇弧度）
      const skirtGeo = new THREE.BoxGeometry(width * 1.06, height * 0.16, depth * 1.06, 6, 1, 6);
      const sPos = skirtGeo.attributes.position;
      for (let i = 0; i < sPos.count; i++) {
        const vx = sPos.getX(i), vy = sPos.getY(i), vz = sPos.getZ(i);
        const edgeDist = Math.pow(vx / (width * 0.53), 2) * Math.pow(vz / (depth * 0.53), 2);
        sPos.setY(i, vy + edgeDist * height * 0.42);
      }
      skirtGeo.computeVertexNormals();
      const skirt = new THREE.Mesh(skirtGeo, tileMat);
      skirt.position.y = height * 0.12;
      skirt.castShadow = true;
      group.add(skirt);

      // 反宇曲面坡屋顶主体（中间微凹举折、四角翘起）
      const roofGeo = new THREE.CylinderGeometry(width * 0.44, width * 0.75, height * 0.86, 4, 4);
      roofGeo.rotateY(Math.PI / 4);
      const rPos = roofGeo.attributes.position;
      for (let i = 0; i < rPos.count; i++) {
        const vy = rPos.getY(i);
        const normY = (vy + height * 0.43) / (height * 0.86);
        const sag = 1.0 - Math.sin(normY * Math.PI) * 0.08;
        rPos.setX(i, rPos.getX(i) * sag);
        rPos.setZ(i, rPos.getZ(i) * sag);
      }
      roofGeo.computeVertexNormals();
      const roof = new THREE.Mesh(roofGeo, tileMat);
      roof.scale.set(1, 1, depth / width);
      roof.position.y = height * 0.53;
      roof.castShadow = true;
      group.add(roof);

      // 四条垂脊与翼角翘起仙人走兽 (Corner Ridges & Upturned Eave Tips)
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
        const horn = new THREE.Mesh(new THREE.ConeGeometry(Math.max(0.18, width * 0.022), height * 0.42, 4), withGoldRidge ? mats.goldTrim : tileMat);
        horn.position.set(sx * width * 0.52, height * 0.34, sz * depth * 0.52);
        horn.rotation.z = -sx * 0.55;
        horn.rotation.x = sz * 0.55;
        group.add(horn);
      });

      // 正脊与两端鸱吻脊兽 (Main Ridge & Chiwen Dragon Finials)
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(width * 0.62, height * 0.22, Math.max(0.42, depth * 0.09)), tileMat);
      ridge.position.y = height * 0.96;
      group.add(ridge);

      if (withGoldRidge) {
        const goldStrip = new THREE.Mesh(new THREE.BoxGeometry(width * 0.60, height * 0.09, Math.max(0.46, depth * 0.1)), mats.goldTrim);
        goldStrip.position.y = height * 1.03;
        group.add(goldStrip);
        [-1, 1].forEach(side => {
          const chiwen = new THREE.Mesh(new THREE.ConeGeometry(0.36, height * 0.45, 5), mats.goldTrim);
          chiwen.position.set(side * width * 0.31, height * 1.12, 0);
          chiwen.rotation.z = -side * 0.22;
          group.add(chiwen);
        });
      }
      return group;
    }

    function createBalustradeSegment(x1, y1, z1, x2, y2, z2, postCount = 3) {
      const group = new THREE.Group();
      const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      const steps = Math.max(1, postCount);

      for (let i = 0; i < steps; i++) {
        const tMid = (i + 0.5) / steps;
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.05, len / steps + 0.1), mats.whiteMarble);
        panel.position.set(x1 + dx * tMid, y1 + dy * tMid + 0.5, z1 + dz * tMid);
        panel.rotation.order = 'YXZ';
        panel.rotation.y = Math.atan2(dx, dz);
        panel.rotation.x = -Math.atan2(dy, len);
        group.add(panel);
      }
      for (let i = 0; i <= postCount; i++) {
        const t = i / postCount;
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.45, 0.8), mats.whiteMarble);
        post.position.set(x1 + dx * t, y1 + dy * t + 0.72, z1 + dz * t);
        group.add(post);
      }
      return group;
    }

    function getYangtzeHalfWidth(u) {
      // 西南江心洲与五桥段江面加宽（半宽 132.0，容纳加长加宽后的江心洲生态岛），流经下关大桥至北段半圆弧平滑过渡为半宽 55
      if (u < 0.30) return 132.0;
      if (u < 0.46) {
        const t = THREE.MathUtils.smoothstep(u, 0.30, 0.46);
        return THREE.MathUtils.lerp(132.0, 56.0, t);
      }
      return 55.0;
    }

    function createMasterplanGroundTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      // 世界坐标映射至 2600 x 2050 巨幅沙盘: X in [-1320, 1280] (w=2600), Z in [-980, 1070] (d=2050)
      const toU = (x) => ((x - (-1320)) / 2600) * 2048;
      const toV = (z) => ((z - (-980)) / 2050) * 2048;
      const toW = (w) => (w / 2600) * 2048;

      // 1. 细腻自然生态基底渐变
      const bgGrad = ctx.createRadialGradient(toU(20), toV(40), 120, toU(0), toV(45), 1750);
      bgGrad.addColorStop(0, '#34493e');
      bgGrad.addColorStop(0.55, '#28422b');
      bgGrad.addColorStop(1, '#1c3120');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 2048, 2048);

      // 2. 各大地理片区柔和过渡底色
      function drawSoftZone(cx, cz, rx, rz, colorInner, colorOuter) {
        ctx.save();
        ctx.translate(toU(cx), toV(cz));
        ctx.scale(1, (rz / rx) * (2600 / 2050));
        const r = toW(rx);
        const g = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r);
        g.addColorStop(0, colorInner);
        g.addColorStop(0.72, colorOuter);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 江北老山森林氧吧深翠底色 (X = -820, Z = -60)
      drawSoftZone(-820, -60, 260, 380, 'rgba(20, 86, 38, 0.94)', 'rgba(26, 72, 38, 0.48)');
      // 江北新城与青奥体育馆文体带底色 (X = -635, Z = 95)
      drawSoftZone(-615, 115, 165, 220, 'rgba(42, 84, 72, 0.88)', 'rgba(36, 68, 58, 0.38)');
      // 河西新城现代CBD蓝灰城市底色 (纪念馆 -> 奥体 -> 青奥双塔)
      drawSoftZone(-210, 65, 125, 360, 'rgba(56, 74, 98, 0.92)', 'rgba(45, 60, 80, 0.45)');
      // 河西滨江风光带翡翠生态岸线
      drawSoftZone(-255, 120, 48, 360, 'rgba(36, 110, 62, 0.90)', 'rgba(36, 92, 52, 0.42)');
      // 金陵古都主城核心区暖石底色 (紫峰—鸡鸣寺—玄武湖—中华门—夫子庙)
      drawSoftZone(45, 25, 225, 290, 'rgba(68, 77, 92, 0.92)', 'rgba(54, 63, 76, 0.45)');
      // 钟山风景区皇家园林苍翠底色 (右移至 X = 395 ~ 560)
      drawSoftZone(495, -15, 255, 280, 'rgba(28, 78, 36, 0.92)', 'rgba(32, 68, 36, 0.45)');

      ctx.save();

      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.38)';

      for (let i = 0; i <= 120; i++) {
        const pt = YANGTZE_MAIN_CURVE.getPointAt(i / 120);
        if (i === 0) ctx.moveTo(toU(pt.x), toV(pt.z));
        else ctx.lineTo(toU(pt.x), toV(pt.z));
      }
      ctx.stroke();

      ctx.strokeStyle = '#0369a1';
      ctx.lineWidth = toW(122);
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;

        const pt = YANGTZE_MAIN_CURVE.getPointAt(u);

        const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
        const hw = getYangtzeHalfWidth(u);

        const pLeft = pt.clone().addScaledVector(normal, -hw);
        const pRight = pt.clone().addScaledVector(normal, hw);
        leftBankPts.push(new THREE.Vector3(pLeft.x, 0.65, pLeft.z));
        rightBankPts.push(new THREE.Vector3(pRight.x, 0.65, pRight.z));

        const vIdx = i * 6;
        riverPositions[vIdx]     = pLeft.x;
        riverPositions[vIdx + 1] = 0.22; // 高出陆地基底(-0.35)，确保江水饱满清晰可见
        riverPositions[vIdx + 2] = pLeft.z;
        riverPositions[vIdx + 3] = pRight.x;
        riverPositions[vIdx + 4] = 0.22;
        riverPositions[vIdx + 5] = pRight.z;

        const uvIdx = i * 4;

        riverUVs[uvIdx + 2] = u * 24;
        riverUVs[uvIdx + 3] = 3.5;

          riverIndices.push(a, b, c, b, d, c);

      // -------------------------------------------------------------------------
      const qixiaGroup = new THREE.Group();
      const QXX = 790, QXZ = -380;
      qixiaGroup.position.set(QXX, 0, QXZ);

      // 1. 栖霞山三峰（主峰凤翔峰海拔286米、东峰龙山、西峰虎山）丹枫红叶地貌网格（纵深 140，北界 Z=-450 与江岸 Z=-505 留有 55 单位滨江陆地缓冲！）
      const qxGeo = new THREE.PlaneGeometry(206, 138, 64, 52);
      qxGeo.rotateX(-Math.PI / 2);
      const qxPos = qxGeo.attributes.position;
      const qxCols = new Float32Array(qxPos.count * 3);
      const cRubyMaple = new THREE.Color(0x991b1b);
      const cCrimsonMaple = new THREE.Color(0xdc2626);
      const cScarletMaple = new THREE.Color(0xef4444);
      const cFlameMaple = new THREE.Color(0xea580c);
      const cGoldMaple = new THREE.Color(0xf59e0b);

      function getQixiaHeight(lx, lz) {
        let h = 0;
        // 中峰：凤翔峰主峰 (lx = 6, lz = -8, H = 62)
        const dMain = Math.hypot(lx - 6, (lz - (-8)) * 1.12);
        h += 62 * Math.exp(-Math.pow(dMain / 38, 1.82));
        // 东峰：龙山临江红枫岭 (lx = 52, lz = -16, H = 48)
        const dEast = Math.hypot(lx - 52, (lz - (-16)) * 1.08);
        h += 48 * Math.exp(-Math.pow(dEast / 33, 1.78));
        // 西峰：虎山桃花涧与红叶谷山脊 (lx = -48, lz = -4, H = 46)
        const dWest = Math.hypot(lx - (-48), (lz - (-4)) * 1.08);
        h += 46 * Math.exp(-Math.pow(dWest / 33, 1.78));
        // 南麓栖霞古寺与明镜湖平缓谷地 (lz > 14)
        if (lz > 14 && Math.abs(lx) < 38) {
          const flatBlend = THREE.MathUtils.smoothstep(lz, 14, 26);
          h = THREE.MathUtils.lerp(h, Math.min(h, 2.0), flatBlend);
        }
        if (h > 2.5) {
          h += (Math.sin(lx * 0.12 + lz * 0.09) * 2.8 + Math.cos(lx * 0.08 - lz * 0.11) * 2.2) * Math.min(1, h / 22);
        }
        return Math.max(0, h);
      }

      for (let i = 0; i < qxPos.count; i++) {
        const vx = qxPos.getX(i), vz = qxPos.getZ(i);
        const rawY = getQixiaHeight(vx, vz);
        const vy = rawY < 0.8 ? 0.45 : rawY + 0.6;
        qxPos.setY(i, vy);

        // 全山地表铺满落红枫叶毯与丹枫渐变色（漫山红遍、层林尽染）
        const c = new THREE.Color();
        const wave = Math.sin(vx * 0.10 + vz * 0.09) * Math.cos(vx * 0.08 - vz * 0.11);
        if (vy < 8) {
          c.copy(cFlameMaple).lerp(cGoldMaple, Math.max(0, wave * 0.65 + 0.25));
        } else if (vy < 36) {
          c.copy(cCrimsonMaple).lerp(wave > 0 ? cScarletMaple : cFlameMaple, Math.abs(wave) * 0.85);
        } else {
          c.copy(cRubyMaple).lerp(cCrimsonMaple, THREE.MathUtils.clamp((vy - 36) / 28, 0, 1));
        }
        qxCols[i * 3] = c.r;
        qxCols[i * 3 + 1] = c.g;
        qxCols[i * 3 + 2] = c.b;
      }

      // 6. “秋栖霞 · 满山红枫”：420+ 棵高密度火红鸡爪槭、枫香、羽毛枫、红乌桕与古银杏铺满三峰每一寸山坡！
      const mapleCrownMats = [
        new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.55, emissive: new THREE.Color(0x7f1d1d), emissiveIntensity: 0.16 }), // 丹枫正红
        new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.52, emissive: new THREE.Color(0x991b1b), emissiveIntensity: 0.18 }), // 绯红鸡爪槭
        new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.58, emissive: new THREE.Color(0x450a0a), emissiveIntensity: 0.15 }), // 深红霜叶
        new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.54, emissive: new THREE.Color(0x9a3412), emissiveIntensity: 0.16 }), // 烈焰橙红枫
        new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.56, emissive: new THREE.Color(0x78350f), emissiveIntensity: 0.14 })  // 琥珀红金枫
      ];

      function createRedMapleTree(scale = 1.0, seed = 0) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(sharedGeos.trunkCyl, mats.treeTrunk);
        trunk.position.y = 1.0;
        trunk.castShadow = true;
        tree.add(trunk);
        // 饱满伞状多层红枫树冠
        const offsets = [
          [0, 3.3, 0, 1.55, 1.05, 1.55],
          [-0.92, 2.8, 0.52, 1.15, 0.88, 1.15],
          [0.92, 2.85, -0.48, 1.15, 0.88, 1.15],
          [-0.45, 2.9, -0.82, 1.08, 0.85, 1.08],
          [0.48, 3.85, 0.32, 1.05, 0.82, 1.05]
        ];
        offsets.forEach(([ox, oy, oz, sx, sy, sz], idx) => {
          const mMat = mapleCrownMats[(seed + idx) % mapleCrownMats.length];
          const puff = new THREE.Mesh(sharedGeos.wutongPuff, mMat);
          puff.position.set(ox, oy, oz);
          puff.scale.set(sx, sy, sz);
          puff.rotation.y = seed + idx;
          puff.castShadow = true;
          tree.add(puff);
        });
        tree.scale.setScalar(scale);
        return tree;
      }

      // 采用黄金螺旋 + 网格交错算法，在栖霞山三峰密植 420 棵火红枫树，做到真正的“满山红枫”！
      for (let m = 0; m < 420; m++) {
        // 黄金角分布覆盖三峰核心区 + 全山坡面
        const rRatio = Math.sqrt((m + 0.5) / 420);
        const theta = m * 2.3999632;
        let mx = Math.cos(theta) * rRatio * 96;
        let mz = Math.sin(theta) * rRatio * 68 - 4;

        // 避开栖霞古寺大殿中轴心、明镜湖水面中心与山顶太虚亭正中心
        if (mz > 11 && mz < 40 && Math.abs(mx) < 18) {
          mx = mx < 0 ? mx - 20 : mx + 20;
        }
        if (Math.hypot(mx - (-28), mz - 32) < 14) {
          mx -= 16;
        }
        if (Math.hypot(mx - 6, mz - (-8)) < 7.5) {
          mx += 9;
        }

        const my = getQixiaHeight(mx, mz) + 0.45;
        const sc = 1.08 + (m % 4) * 0.22;
        const maple = createRedMapleTree(sc, m);
        maple.position.set(mx, my - 0.25, mz);
        qixiaGroup.add(maple);
      }

      group.add(qixiaGroup);

      scene.add(group);
    }

    // ============================================================================
    // 7. 地标四 & 五 & 六：【南京奥体中心】、【青奥双塔 & 南京眼步行桥】、【侵华日军南京大屠杀遇难同胞纪念馆】
    // ============================================================================
    function buildHexiModernLandmarks() {
      const group = new THREE.Group();

      // -------------------------------------------------------------------------
      // 7.1 地标四：【南京奥体中心】1:1 真实建筑形态重塑 (Hexi Central X = -155, Z = 30)
      // 真实特征：
      // - 内部为敞口阶梯看台碗，可以直接俯瞰中央碧绿足球场草坪与400米红跑道
      // - 屋盖为东西两瓣高耸隆起、南北两端低垂轻薄的银白色双曲面月牙马鞍形金属屋盖（中间留有巨大椭圆形露天开口）
      // - 灵魂标志：两条跨度360米的巨型鲜红箱形钢拱架，以45度外倾角从南北两端的巨大混凝土拱座起跳，高高飞越银白屋盖上方，并通过一排排倾斜钢拉杆将屋面吊起
      // -------------------------------------------------------------------------
      const aoti = new THREE.Group();
      const AX = -145, AZ = -5;
      aoti.position.set(AX, 0, AZ);
      aoti.scale.setScalar(1.10);

      // 1. 奥体中心双层景观大平台基座与环场彩虹健身跑道
      const aotiPlaza = new THREE.Mesh(new THREE.CylinderGeometry(52, 56, 1.2, 56), mats.platformInlay);
      aotiPlaza.position.y = 0.6;
      aotiPlaza.receiveShadow = true;
      const outerFitnessRing = new THREE.Mesh(new THREE.RingGeometry(43, 47.5, 56), mats.aotiTrackMat);
      outerFitnessRing.rotation.x = -Math.PI / 2;
      outerFitnessRing.position.y = 1.25;
      aoti.add(aotiPlaza, outerFitnessRing);

      // 四座扇形二层观众疏散大平台与落地宽大石阶（将二层看台环廊稳稳接至地面广场！）
      [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5].forEach(ang => {
        const rampGroup = new THREE.Group();
        rampGroup.rotation.y = ang;
        const concoursePod = new THREE.Mesh(new THREE.BoxGeometry(14, 3.8, 8), mats.whiteMarble);
        concoursePod.position.set(0, 1.9, 34);
        const grandStair = new THREE.Mesh(new THREE.BoxGeometry(12, 1.4, 9.5), mats.stepTread);
        grandStair.position.set(0, 1.8, 40.5);
        grandStair.rotation.x = 0.38;
        rampGroup.add(concoursePod, grandStair);
        aoti.add(rampGroup);
      });

      // 2. 主体育场内场：FIFA标准翠绿足球场草坪（中线、中圈、南北禁区框、双球门）+ 8道400米红色跑道
      const pitchTurf = new THREE.Mesh(new THREE.CylinderGeometry(16.0, 16.0, 0.38, 40), mats.aotiTurfMat);
      pitchTurf.scale.set(1.26, 1, 0.88);
      pitchTurf.position.y = 1.32;
      const centerCircle = new THREE.Mesh(new THREE.RingGeometry(3.1, 3.45, 28), mats.whiteMarble);
      centerCircle.rotation.x = -Math.PI / 2;
      centerCircle.position.y = 1.54;
      const halfwayLine = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.05, 24), mats.whiteMarble);
      halfwayLine.position.y = 1.53;
      aoti.add(pitchTurf, centerCircle, halfwayLine);

      // 东西两端禁区白线框与足球门架
      [-14.5, 14.5].forEach(gx => {
        const penBox = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.05, 10.5), mats.whiteMarble);
        penBox.position.set(gx * 0.82, 1.52, 0);
        const innerBox = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.06, 9.8), mats.aotiTurfMat);
        innerBox.position.set(gx * 0.82, 1.53, 0);
        const goalFrame = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 3.2), mats.whiteMarble);
        goalFrame.position.set(gx, 2.1, 0);
        aoti.add(penBox, innerBox, goalFrame);
      });

      // 400米标准跑道与白色分道线
      const runningTrack = new THREE.Mesh(new THREE.RingGeometry(15.0, 22.2, 48), mats.aotiTrackMat);
      runningTrack.rotation.x = -Math.PI / 2;
      runningTrack.scale.set(1.22, 0.9, 1);
      runningTrack.position.y = 1.30;
      aoti.add(runningTrack);
      [16.8, 18.6, 20.4].forEach(tr => {
        const laneRing = new THREE.Mesh(new THREE.RingGeometry(tr, tr + 0.14, 48), mats.whiteMarble);
        laneRing.rotation.x = -Math.PI / 2;
        laneRing.scale.set(1.22, 0.9, 1);
        laneRing.position.y = 1.33;
        aoti.add(laneRing);
      });

      // 3. 内部三层阶梯看台碗（红、蓝、黄、白四色分区看台）与东西两端巨型LED记分牌大屏
      const bowlColors = [mats.aotiCrimsonArch, mats.qingaoGlassMat, mats.goldTrim, mats.whiteMarble];
      for (let t = 0; t < 4; t++) {
        const tierR = 22.0 + t * 2.2;
        const tierH = 2.6 + t * 2.1;
        const standRing = new THREE.Mesh(
          new THREE.CylinderGeometry(tierR + 1.9, tierR, 2.1, 48, 1, true),
          bowlColors[t % bowlColors.length]
        );
        standRing.scale.set(1.2, 1, 0.92);
        standRing.position.y = tierH;
        aoti.add(standRing);
      }
      [-31, 31].forEach(sx => {
        const screenBoard = new THREE.Mesh(new THREE.BoxGeometry(1.2, 4.2, 8.8), mats.darkDoor);
        screenBoard.position.set(sx, 11.8, 0);
        const screenGlow = new THREE.Mesh(new THREE.BoxGeometry(1.3, 3.4, 7.8), mats.qingaoGlassMat);
        screenGlow.position.set(sx, 11.8, 0);
        aoti.add(screenBoard, screenGlow);
      });

      // 4. 外围银白色流线型【双曲面马鞍形悬挑金属屋盖 + 28道放射状屋面结构钢肋条 + 内环透明阳光板】
      const roofGeo = new THREE.RingGeometry(18.2, 35.5, 64, 10);
      roofGeo.rotateX(-Math.PI / 2);
      const rPos = roofGeo.attributes.position;
      for (let i = 0; i < rPos.count; i++) {
        const vx = rPos.getX(i), vz = rPos.getZ(i);
        const rDist = Math.hypot(vx, vz);
        const ang = Math.atan2(vz, vx);
        const saddleWave = Math.cos(ang * 2) * 4.5;
        const radialSlope = ((rDist - 18.2) / 17.3) * 2.6;
        rPos.setY(i, 10.8 + saddleWave + radialSlope);
        rPos.setX(i, vx * 1.18);
        rPos.setZ(i, vz * 0.92);
      }
      roofGeo.computeVertexNormals();
      const saddleRoof = new THREE.Mesh(roofGeo, mats.silverDome);
      saddleRoof.castShadow = true;
      aoti.add(saddleRoof);

      // 屋面放射状银白钢结构肋骨与内圈蓝晶采光环
      for (let i = 0; i < 28; i++) {
        const ang = (i / 28) * Math.PI * 2;
        const saddleY = 11.8 + Math.cos(ang * 2) * 4.2;
        const rib = new THREE.Mesh(new THREE.BoxGeometry(16.5, 0.38, 0.45), mats.whiteMarble);
        rib.position.set(Math.cos(ang) * 27 * 1.18, saddleY, Math.sin(ang) * 27 * 0.92);
        rib.rotation.y = -ang;
        aoti.add(rib);
      }

      // 体育场外立面流线型玻璃幕墙与 24 根V形斜撑钢柱裙边
      const facadeWallGeo = new THREE.CylinderGeometry(33.5, 29.5, 9.8, 56, 4, true);
      const fPos = facadeWallGeo.attributes.position;
      for (let i = 0; i < fPos.count; i++) {
        const vx = fPos.getX(i), vy = fPos.getY(i), vz = fPos.getZ(i);
        const ang = Math.atan2(vz, vx);
        if (vy > 0) fPos.setY(i, vy + Math.cos(ang * 2) * 3.8);
        fPos.setX(i, vx * 1.18);
        fPos.setZ(i, vz * 0.92);
      }
      facadeWallGeo.computeVertexNormals();
      const facadeSkirt = new THREE.Mesh(facadeWallGeo, mats.qingaoGlassMat);
      facadeSkirt.position.y = 5.8;
      aoti.add(facadeSkirt);

      for (let i = 0; i < 24; i++) {
        const ang = (i / 24) * Math.PI * 2;
        const colH = 9.5 + Math.cos(ang * 2) * 2.5;
        const vCol = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, colH, 8), mats.whiteMarble);
        vCol.position.set(Math.cos(ang) * 32.5 * 1.18, colH * 0.5 + 1.0, Math.sin(ang) * 32.5 * 0.92);

    function createMingXiaolingPlaqueTexture(titleText, bgHex = '#1e3a8a', textHex = '#fde047') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, 256, 128);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 8;
      ctx.strokeRect(6, 6, 244, 116);
      ctx.fillStyle = textHex;
      ctx.font = 'bold 52px "STKaiti", "KaiTi", "PingFang SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(titleText, 128, 66);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    function buildXuanwuLakeAndCityWall() {

      // -------------------------------------------------------------------------

      // 还原图三湖面左右两侧标志性的【圆形音乐喷泉水景浮环】(Circular Floating Fountain Rings in Photo 3)
      [[-36, 12, 3.8], [42, 18, 4.4]].forEach(([fx, fz, fr]) => {

      // 自然有机轮廓洲岛生成辅助函数（深绿护岸树丛边缘 + 自然草坪 + 驳岸石线）
      const metasequoiaRedMat = new THREE.MeshStandardMaterial({ color: 0xc2410c, roughness: 0.65 }); // 水杉红褐秋叶

      // 2. 【环洲 & 樱洲】（1:1还原图三前景核心：左侧笔直金色梧桐长堤、弯月抱湖半岛、内部水湾内湖、中央红杉林簇与疏林草坪）
      const huanzhouPts = [
        [-24, 24], [-26, 8], [-27, -8], [-22, -14], [-8, -14],

      const huanzhouIsle = createOrganicIslandMesh(huanzhouPts, 1.25);
      xuanwuGroup.add(huanzhouIsle);

      // 环洲岛内曲折的【内湖水湾水道】（还原图三环洲岛中央蜿蜒的深色内湖水道与小桥！）
      const innerCoveShape = new THREE.Shape();
      innerCoveShape.moveTo(-18, 12);
      innerCoveShape.quadraticCurveTo(-19, 2, -14, -4);
      innerCoveShape.quadraticCurveTo(-4, -8, 6, -3);
      innerCoveShape.quadraticCurveTo(10, 3, 4, 8);
      innerCoveShape.quadraticCurveTo(-6, 4, -12, 14);
      innerCoveShape.closePath();
      const coveGeo = new THREE.ExtrudeGeometry(innerCoveShape, { depth: 0.45, bevelEnabled: false });
      coveGeo.rotateX(Math.PI / 2);
      const innerCoveWater = new THREE.Mesh(coveGeo, mats.lakeWater);
      innerCoveWater.position.y = 1.38;
      xuanwuGroup.add(innerCoveWater);

      // 环洲内湾中心草坪与图三标志性的【深秋火红水杉林簇】
      const centerMeadow = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 8.2, 0.2, 20), lushLawnMat);
      centerMeadow.scale.set(1.3, 1, 0.85);
      centerMeadow.position.set(-4, 1.35, 2);
      xuanwuGroup.add(centerMeadow);

      for (let r = 0; r < 16; r++) {
        const rx = -10 + (r % 6) * 2.2 + (r % 2) * 0.5;

      // 图三左侧最抢眼的【环洲西岸笔直金色梧桐/垂柳林荫大道长堤】（从南端一路笔直延伸至北端芳桥）
      const westPromenade = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.3, 38), mats.platformInlay);
      westPromenade.position.set(-24.2, 1.32, 5);
      xuanwuGroup.add(westPromenade);
      for (let t = 0; t < 15; t++) {

      }

      // 图三左下角与西岸整齐停靠的【黄色与白色游船码头栈桥】
      [
        { x: -27.5, z: 14, color: mats.imperialYellowGlaze, dir: -1 },

      // 樱洲（藏经楼重檐绿琉璃瓦与白墙黛瓦江南庭院，位于 [-4, -9]）
      const cangjingPav = new THREE.Group();

      const cjRoof1 = createChineseRoof(7.6, 6.2, 1.6, mats.greenGlaze, false);
      cjRoof1.position.y = 3.9;
      const cjBody2 = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.2, 3.4), mats.ancientLatticeMat);
      cjBody2.position.y = 5.4;

      cangjingPav.add(cjBase, cjBody1, cjRoof1, cjBody2, cjRoof2);
      xuanwuGroup.add(cangjingPav);

      // 3. 【梁洲】（图三左上方自然绿岛，带芳桥与览胜楼，位于 [-34, -10]）
      const liangzhouPts = [
        [-44, -2], [-46, -12], [-38, -18], [-28, -16], [-27, -6], [-34, 0]

      // 4. 【菱洲】（图三中上方红叶绿树岛屿，由细长林荫石堤与梁洲相连，位于 [-12, -28]）
      const lingzhouPts = [

      // 5. 【翠洲】（图三右侧绿岛 + 标志性的修长弧形林荫长堤“翠虹堤” + 白色游艇栈桥，位于 [28, -8]）
      const cuizhouPts = [

      xuanwuGroup.add(cuizhouIsle);

      // 图三右侧极具辨识度的【弧形林荫长堤（翠虹堤）】与白色游船码头
      const cuihongPts = [
        new THREE.Vector3(36, 0.7, -3),

      ];
      const cuihongCurve = new THREE.CatmullRomCurve3(cuihongPts);
      const cuihongCauseway = new THREE.Mesh(
        new THREE.TubeGeometry(cuihongCurve, 24, 1.8, 6, false),

      );
      cuihongCauseway.scale.set(1, 0.35, 1);
      xuanwuGroup.add(cuihongCauseway);
      for (let c = 0; c <= 8; c++) {
        const pt = cuihongCurve.getPointAt(c / 8);

        tree.position.set(pt.x, 0.8, pt.z);
        xuanwuGroup.add(tree);
      }

      // 五洲之间的白玉拱桥与林荫堤桥（连接西岸玄武门、环洲、梁洲、菱洲、翠洲与南岸）
      function createLakeArchBridge(x1, z1, x2, z2) {
        const brGroup = new THREE.Group();
        const midX = (x1 + x2) * 0.5, midZ = (z1 + z2) * 0.5;
        const span = Math.hypot(x2 - x1, z2 - z1);
        const rotY = Math.atan2(x2 - x1, z2 - z1);
        brGroup.position.set(midX, 0.5, midZ);
        brGroup.rotation.y = rotY;

        const segs = 12;
        for (let s = 0; s < segs; s++) {
          const u0 = s / segs - 0.5, u1 = (s + 1) / segs - 0.5;
          const um = (u0 + u1) * 0.5;
          const yArch = Math.cos(um * Math.PI) * 1.8 + 0.55;
          const tilt = Math.sin(um * Math.PI) * 0.28;
          const slab = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.45, (span / segs) + 0.25), mats.whiteMarble);
          slab.position.set(0, yArch, um * span);
          slab.rotation.x = tilt;
          brGroup.add(slab);
        }
        return brGroup;
      }

      xuanwuGroup.add(
        createLakeArchBridge(-24, 24, -32, 34), // 南岸进入环洲长桥
        createLakeArchBridge(-25, -6, -30, -6), // 环洲至梁洲芳桥
        createLakeArchBridge(-28, -16, -19, -25), // 梁洲至菱洲堤桥
        createLakeArchBridge(14, -4, 19, -5),   // 环洲至翠洲桥
        createLakeArchBridge(-46, -6, -54, -4)  // 梁洲至西岸玄武门桥
      );

      // 在五洲岛屿四周边缘密植葱茏护岸绿树与秋叶林（还原图三岛屿四周浓密的绿树环绕感）
      const islandTreeZones = [
        ...huanzhouPts.map(([x, z]) => [x * 0.88, z * 0.88]),
        ...liangzhouPts.map(([x, z]) => [x, z]),
        ...lingzhouPts.map(([x, z]) => [x, z]),
        ...cuizhouPts.map(([x, z]) => [x, z])
      ];
      islandTreeZones.forEach(([tx, tz], idx) => {
        const tree = idx % 3 === 0 ? createWutongTree(0.85, idx) : (idx % 2 === 0 ? createWeepingWillow(0.9, idx) : createChinesePine(0.9, idx));
        tree.position.set(tx, 1.25, tz);
        xuanwuGroup.add(tree);
      });

      // 6. 西岸【玄武门】三孔重檐城楼
      const xuanwuGate = new THREE.Group();
      xuanwuGate.position.set(-55, 0, -4);
      const xwWall = new THREE.Mesh(new THREE.BoxGeometry(6.8, 8.2, 18), mats.mingBrick);
      xwWall.position.y = 4.1;
      xwWall.castShadow = true;
      [-4.5, 0, 4.5].forEach(az => {
        const arch = new THREE.Mesh(new THREE.BoxGeometry(7.2, 4.2, 2.5), mats.darkDoor);
        arch.position.set(0, 2.1, az);
        xuanwuGate.add(arch);
      });
      const xwTower = new THREE.Mesh(new THREE.BoxGeometry(5.0, 4.4, 12.5), mats.ancientLatticeMat);
      xwTower.position.y = 10.2;
      const xwRoof1 = createChineseRoof(7.2, 14.8, 1.9, mats.darkGreyTile, false);
      xwRoof1.position.y = 12.4;
      const xwRoof2 = createChineseRoof(5.8, 12.2, 2.5, mats.darkGreyTile, true);
      xwRoof2.position.y = 14.2;
      xuanwuGate.add(xwWall, xwTower, xwRoof1, xwRoof2);
      xuanwuGroup.add(xuanwuGate);

      // -------------------------------------------------------------------------
      // 7. 彻底重塑【玄武湖台城 / 解放门六百年明城墙】（告别假管道与错位方块！）
      // 采用分段式下宽上窄收分的明代条石基座 + 高清错缝青砖城墙体 + 城顶海墁石板马道 + 切线精准对齐的外侧凹凸雉堞垛口与内侧女儿墙 + 马面敌台 + 解放门城楼
      // -------------------------------------------------------------------------
      const wallWaypoints = [
        new THREE.Vector3(-52, 0, 36),
        new THREE.Vector3(-28, 0, 44),
        new THREE.Vector3(0,   0, 45),
        new THREE.Vector3(28,  0, 38),
        new THREE.Vector3(50,  0, 20),
        new THREE.Vector3(58,  0, -8),
        new THREE.Vector3(56,  0, -34)
      ];

      function buildAuthenticWallSegment(pA, pB, segIndex) {
        const segGroup = new THREE.Group();
        const vec = new THREE.Vector3().subVectors(pB, pA);
        const len = vec.length();
        const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
        const rotY = Math.atan2(vec.x, vec.z);

        segGroup.position.set(mid.x, 0, mid.z);
        segGroup.rotation.y = rotY;

        const wallH = 8.6;
        // (1) 底部明代须弥条石压顶基座 (宽 6.2m, 高 1.6m)
        const stoneFooting = new THREE.Mesh(new THREE.BoxGeometry(6.2, 1.6, len + 2.2), mats.whiteMarble);
        stoneFooting.position.y = 0.8;
        stoneFooting.receiveShadow = true;
        segGroup.add(stoneFooting);

        // (2) 下宽上窄收分的明代错缝青砖主墙体 (底宽 5.6m, 顶宽 4.6m, 高 7.0m)
        const wallBody = new THREE.Mesh(new THREE.BoxGeometry(5.2, wallH - 1.6, len + 2.0), mats.mingBrick);
        wallBody.position.y = 1.6 + (wallH - 1.6) * 0.5;
        wallBody.castShadow = true;
        wallBody.receiveShadow = true;
        segGroup.add(wallBody);

        // (3) 城墙顶部海墁青砖步行马道与两侧白石压檐线 (高 Y = 8.6m)
        const topWalkway = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.35, len + 2.2), mats.platformInlay);
        topWalkway.position.y = wallH + 0.15;
        topWalkway.receiveShadow = true;
        segGroup.add(topWalkway);

        // (4) 内侧（玄武湖侧 X = -2.35）连续女儿墙护栏 + 外侧（X = +2.35）精准对齐切线的凹凸雉堞垛口！
        const innerParapet = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.05, len + 1.6), mats.mingBrick);
        innerParapet.position.set(-2.35, wallH + 0.8, 0);
        const outerBaseParapet = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.55, len + 1.6), mats.mingBrick);
        outerBaseParapet.position.set(2.35, wallH + 0.55, 0);
        segGroup.add(innerParapet, outerBaseParapet);

        const merlonStep = 2.6;
        const numMerlons = Math.floor(len / merlonStep);
        for (let m = 0; m < numMerlons; m++) {

    // 生成牛首山佛顶宫左前方【摩尼宝珠圆穹顶】1024x512 高清立体佛顶螺髻/菱形莲花瓣浮雕贴图（1:1还原 image_a07cb5.jpg 左前方饱满圆穹顶！）
    function createManiDomeDiamondTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 暖珍珠香槟金/象牙金渐变底色（还原照片左前方圆穹顶温润的香槟金光泽）
      const bg = ctx.createLinearGradient(0, 0, 0, 512);
      bg.addColorStop(0, '#fffbeb');
      bg.addColorStop(0.35, '#f5ebd6');
      bg.addColorStop(0.75, '#e6d5b8');
      bg.addColorStop(1, '#cbb28c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1024, 512);

      // 绘制高密度立体菱形莲花瓣/佛顶发髻网格（每个菱形格带立体受光面、背光面与中心深色镂空螺髻圆孔）
      const cols = 36, rows = 18;
      const cw = 1024 / cols, ch = 512 / rows;

      for (let r = -1; r <= rows; r++) {
        for (let c = -1; c <= cols; c++) {
          const cx = (c + (r % 2) * 0.5) * cw;
          const cy = r * ch;
          const hw = cw * 0.48;
          const hh = ch * 0.92;

          // 菱形外框深古铜凹槽
          ctx.beginPath();
          ctx.moveTo(cx, cy - hh);
          ctx.lineTo(cx + hw, cy);
          ctx.lineTo(cx, cy + hh);
          ctx.lineTo(cx - hw, cy);
          ctx.closePath();
          ctx.fillStyle = '#eaddc5';
          ctx.fill();
          ctx.lineWidth = 2.6;
          ctx.strokeStyle = '#785c38';
          ctx.stroke();

          // 上半受光亮面（珍珠白金高光）
          ctx.beginPath();
          ctx.moveTo(cx, cy - hh * 0.85);
          ctx.lineTo(cx + hw * 0.82, cy);
          ctx.lineTo(cx, cy);
          ctx.lineTo(cx - hw * 0.82, cy);
          ctx.closePath();
          ctx.fillStyle = 'rgba(255, 252, 240, 0.82)';
          ctx.fill();

          // 下半立体阴影面（暖古铜金）
          ctx.beginPath();
          ctx.moveTo(cx, cy + hh * 0.85);
          ctx.lineTo(cx + hw * 0.82, cy);
          ctx.lineTo(cx, cy);
          ctx.lineTo(cx - hw * 0.82, cy);
          ctx.closePath();
          ctx.fillStyle = 'rgba(161, 124, 78, 0.45)';
          ctx.fill();

          // 菱形格中心深色镂空花瓣孔洞（赋予实景图标志性的菠萝格/莲花瓣立体颗粒感！）
          ctx.beginPath();
          ctx.ellipse(cx, cy + hh * 0.08, hw * 0.34, hh * 0.32, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#5c4328';
          ctx.fill();

          // 螺髻顶部金色珠点
          ctx.beginPath();
          ctx.arc(cx, cy - hh * 0.18, hw * 0.18, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    // 生成牛首山佛顶宫右侧【佛手袈裟/菩提叶大穹顶】1024x1024 暖香槟玫瑰金 + 中心放射状树枝叶脉大镂空花纹贴图（1:1还原 image_a07cb5.jpg 右侧大穹顶！）
    function createKasayaCopperCanopyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 1. 暖香槟玫瑰金 / 浅铜金色金属基底（严格还原实景图右侧大穹顶优雅的浅玫瑰铜金色调 #e6b89c ~ #c98a6b）
      const bg = ctx.createRadialGradient(380, 320, 60, 512, 512, 760);
      bg.addColorStop(0, '#f5d6c3');
      bg.addColorStop(0.42, '#e2b195');
      bg.addColorStop(0.78, '#c98e70');
      bg.addColorStop(1, '#a66c4e');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1024, 1024);

      // 2. 全穹顶细密蜂窝/菱形镂空小网眼肌理
      const step = 22;
      for (let y = 0; y < 1024; y += step) {
        const offset = (Math.floor(y / step) % 2) * (step * 0.5);
        for (let x = -step; x < 1024 + step; x += step) {
          const px = x + offset;
          // 细密深棕镂空网孔
          ctx.fillStyle = 'rgba(72, 38, 24, 0.62)';
          ctx.beginPath();
          ctx.moveTo(px, y - 6.5);
          ctx.lineTo(px + 6.5, y);
          ctx.lineTo(px, y + 6.5);
          ctx.lineTo(px - 6.5, y);
          ctx.closePath();
          ctx.fill();
        }
      }

      // 3. 实景图右侧大穹顶最核心视觉标志：从左下舌尖向右上扇形分叉舒展的【放射状菩提叶脉 / 佛手树枝状大镂空花纹】！
      const originX = 360, originY = 780;
      const branchAngles = [-2.15, -1.85, -1.58, -1.32, -1.06, -0.82, -0.58];

      branchAngles.forEach((ang, bIdx) => {
        const len = 360 + (bIdx % 3) * 65;
        // 绘制主叶脉旁成排的大尺寸水滴/菱形镂空窗洞（还原照片中树枝状深色大镂空肌理）
        const numCells = 14;
        for (let k = 2; k <= numCells; k++) {
          const t = k / numCells;
          const r = t * len;
          const curveBend = Math.sin(t * Math.PI) * (bIdx - 3) * 18;
          const bx = originX + Math.cos(ang) * r + Math.cos(ang + Math.PI / 2) * curveBend;
          const by = originY + Math.sin(ang) * r + Math.sin(ang + Math.PI / 2) * curveBend;

          const cellW = (1 - Math.abs(t - 0.55) * 1.1) * 20;
          const cellH = (1 - Math.abs(t - 0.55) * 1.1) * 10;
          if (cellW > 4) {
            ctx.save();
            ctx.translate(bx, by);
            ctx.rotate(ang);
            // 叶脉两侧对称的大镂空孔洞
            [-14, 14].forEach(lat => {
              ctx.fillStyle = '#3b1d11';
              ctx.beginPath();
              ctx.ellipse(0, lat, cellW, cellH, 0.25 * Math.sign(lat), 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#f5d6c3';
              ctx.lineWidth = 2.2;
              ctx.stroke();
            });
            // 叶脉主干浅玫瑰金实心肋带
            ctx.fillStyle = '#f2cab2';
            ctx.fillRect(-cellW * 0.9, -4.5, cellW * 1.8, 9);
            ctx.restore();
          }
        }
      });

      // 4. 叠加流线型金属网壳主肋条高光
      ctx.strokeStyle = 'rgba(255, 237, 224, 0.55)';
      ctx.lineWidth = 2.0;
      for (let i = -1024; i <= 2048; i += 32) {
        ctx.beginPath();
        ctx.moveTo(i, 1024);
        ctx.quadraticCurveTo(i + 180, 512, i + 460, 0);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(i, 1024);
        ctx.quadraticCurveTo(i - 160, 512, i - 420, 0);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    function buildNiushoushanUsnisaPalace() {
      // -------------------------------------------------------------------------
      // 地标十三：【牛首山文化旅游区 · 佛顶宫 & 佛顶塔】1:1 严格对照最新上传实景图 (image_a07cb5.jpg) 精准重构
      // 实景图 (image_a07cb5.jpg) 核心空间方位与建筑造型（从南向北俯视）：
      // 1. 【左前方主C位 — 摩尼宝珠圆穹顶】：
      //    - 位于画面左前方（lx = -11.5, lz = +2.5），为一座极其饱满浑圆的香槟金立体菱形发髻/莲花瓣球冠大穹顶（半径 16.2m）；

      //    - 圆鼓座左外侧与左前侧环绕着一圈宽阔的【深灰蓝弧形镜面水池挑台】，最左侧伸出两道横跨山林的石栈桥！
      // 2. 【摩尼宝珠正后方山巅 — 九级四面唐风佛顶塔】：
      //    - 位于摩尼宝珠圆穹顶的正后方偏左一点（lx = -9.5, lz = -23.5），恰好从摩尼宝珠圆顶与右侧大穹顶交汇处的正后方拔地而起！
      //    - 严格刻画 9 层暖金铜色飞檐翘角屋顶、深棕红唐风木构塔身与顶端直指苍穹的鎏金塔刹；佛顶塔左侧配有米白石材山顶小广场。
      // 3. 【右侧环抱拱起 — 巨型“佛手袈裟/菩提叶”暖香槟玫瑰金镂空大穹顶】：
      //    - 位于摩尼宝珠圆穹顶的右侧（lx: -8 -> +36, lz: -22 -> +21）；
      //    - 左上内缘从摩尼宝珠顶部后侧起拱，紧密贴合摩尼宝珠右侧球面弧线向下延伸，形成泾渭分明的双穹顶咬合缝；
      //    - 主体向右上方饱满隆起成恢弘的暖香槟玫瑰金穹隆，前缘在摩尼宝珠右下前方（lx = +8.5, lz = +19.5）优美下垂成圆润舌尖触地，随后右下边缘呈 S 形波浪弧线高高扬起并落于右侧柱列之上；
      //    - 表面精准还原实景图标志性的【中心放射状树枝叶脉/佛手分叉大镂空花纹 + 细密蜂窝网眼】！
      // 4. 【正前方山崖多层弧形架空柱廊退台 & 右后方山谷大湖泊】：
      //    - 摩尼宝珠正前方山崖（lz = +15 -> +34）层叠筑起三层弧形架空立柱退台长廊、U形内凹双层采光庭院、浅蓝玻璃采光雨棚与右下角白色景交车停车场；
      //    - 大穹顶右后方苍翠山谷间（lx = +32, lz = -46）镶嵌着宽阔平静的自然山间湖泊！
      // -------------------------------------------------------------------------
      const group = new THREE.Group();
      const NX = 205, NZ = 545;
      group.scale.setScalar(1.14);
      group.position.set(NX, 0, NZ);

      const maniDiamondTex = createManiDomeDiamondTexture();
      const maniDiamondMat = new THREE.MeshStandardMaterial({
        map: maniDiamondTex,
        bumpMap: maniDiamondTex,
        bumpScale: 0.45,
        roughness: 0.24,
        metalness: 0.58,
        emissive: new THREE.Color(0xb45309),
        emissiveIntensity: 0.14
      });

      const kasayaRoseGoldTex = createKasayaCopperCanopyTexture();
      const kasayaRoseGoldMat = new THREE.MeshStandardMaterial({
        map: kasayaRoseGoldTex,
        bumpMap: kasayaRoseGoldTex,
        bumpScale: 0.38,
        roughness: 0.26,
        metalness: 0.68,
        side: THREE.DoubleSide,
        emissive: new THREE.Color(0xc2410c),
        emissiveIntensity: 0.18
      });

      const kasayaFineWireMat = new THREE.MeshStandardMaterial({
        color: 0xf5d0ba,
        roughness: 0.22,
        metalness: 0.78,
        wireframe: true,
        transparent: true,
        opacity: 0.38,
        emissive: new THREE.Color(0xd97706),
        emissiveIntensity: 0.20
      });

      const tangPagodaGoldRoofMat = new THREE.MeshStandardMaterial({
        color: 0xeab308,
        roughness: 0.24,
        metalness: 0.62,
        emissive: new THREE.Color(0xb45309),
        emissiveIntensity: 0.22
      });

      const warmBeigeStoneMat = new THREE.MeshStandardMaterial({
        color: 0xe7dec8,
        roughness: 0.55,
        metalness: 0.08
      });

      // 1. 牛首山连绵苍翠自然山脉地形网格 (220m x 185m)
      // 还原实景图背景：左后方高耸连绵的深翠山峰、右后方平缓开阔的湖谷、前景陡峭葱茏的翠绿山崖
      const nsGeo = new THREE.PlaneGeometry(220, 185, 68, 60);
      nsGeo.rotateX(-Math.PI / 2);
      const nsPos = nsGeo.attributes.position;
      const nsCols = new Float32Array(nsPos.count * 3);
      const cDeepPine = new THREE.Color(0x14532d);
      const cLushForest = new THREE.Color(0x166534);
      const cBrightFoliage = new THREE.Color(0x3f6212);

      function getNiushouHeight(lx, lz) {
        let h = 0;
        // 中央佛顶宫主山台 (lx = 0, lz = 0, H = 20.5)
        const dCenter = Math.hypot(lx / 1.35, (lz - 2) / 1.05);
        h += 21.5 * Math.exp(-Math.pow(dCenter / 46, 1.9));

        // 左后方（西北）佛顶塔高耸主峰与远山脉 (lx = -26, lz = -34, H = 32)
        const dNWPeak = Math.hypot((lx + 26) / 1.25, (lz + 34) / 1.05);
        h += 31.0 * Math.exp(-Math.pow(dNWPeak / 42, 1.8));

        // 左翼苍翠山脊 (lx = -54, lz = -6, H = 24)
        const dWest = Math.hypot((lx + 54) / 1.1, (lz + 6) / 1.1);
        h += 23.0 * Math.exp(-Math.pow(dWest / 34, 1.75));

        // 右翼护山翠岭 (lx = 46, lz = 8, H = 20)
        const dEast = Math.hypot((lx - 46) / 1.15, (lz - 8) / 1.05);
        h += 19.5 * Math.exp(-Math.pow(dEast / 34, 1.75));

        // 前景山麓护坡山林脊线 (lz > 26)
        const dFront = Math.hypot((lx + 4) / 1.4, (lz - 42) / 0.85);
        h += 11.5 * Math.exp(-Math.pow(dFront / 36, 1.7));

        // 右后方山谷隐龙湖凹陷盆地 (lx = 32, lz = -46 -> 压低至 H = 2.2)
        const dLake = Math.hypot((lx - 32) / 1.35, (lz + 46) / 0.95);
        if (dLake < 28) {
          const lakeBlend = THREE.MathUtils.smoothstep(dLake, 14, 28);
          h = THREE.MathUtils.lerp(2.0, h, lakeBlend);
        }

        // 中央核心台地平整化 (lx: -28 ~ +32, lz: -18 ~ +22 -> 平整在 H = 18.2)
        if (lx > -30 && lx < 34 && lz > -20 && lz < 24) {
          const coreDist = Math.max(Math.abs(lx - 2) / 31, Math.abs(lz - 2) / 21);
          if (coreDist < 1.0) {
            const b = THREE.MathUtils.smoothstep(coreDist, 0.68, 1.0);
            h = THREE.MathUtils.lerp(18.2, h, b);
          }
        }

        if (h > 2.2) {
          h += (Math.sin(lx * 0.11 + lz * 0.09) * 1.3 + Math.cos(lx * 0.08 - lz * 0.11) * 1.0) * Math.min(1, h / 16);
        }
        return Math.max(0.4, h);
      }

      for (let i = 0; i < nsPos.count; i++) {
        const vx = nsPos.getX(i), vz = nsPos.getZ(i);
        const vy = getNiushouHeight(vx, vz);
        nsPos.setY(i, vy);

        const c = new THREE.Color();
        const n = Math.sin(vx * 0.10 + vz * 0.08) * 0.5 + 0.5;
        c.copy(cDeepPine).lerp(n > 0.58 ? cBrightFoliage : cLushForest, n * 0.85);
        nsCols[i * 3] = c.r;
        nsCols[i * 3 + 1] = c.g;
        nsCols[i * 3 + 2] = c.b;
      }
      nsGeo.setAttribute('color', new THREE.BufferAttribute(nsCols, 3));
      nsGeo.computeVertexNormals();
      const nsMountain = new THREE.Mesh(
        nsGeo,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.86 })
      );
      nsMountain.castShadow = true;
      nsMountain.receiveShadow = true;
      group.add(nsMountain);

      // 2. 右后方山谷宽阔的自然形态大湖泊（1:1还原 image_a07cb5.jpg 右上方山林间波光静谧的湖泊！）
      const lakeShape = new THREE.Shape();
      lakeShape.moveTo(14, -42);
      lakeShape.quadraticCurveTo(26, -54, 46, -50);
      lakeShape.quadraticCurveTo(56, -44, 48, -35);
      lakeShape.quadraticCurveTo(34, -32, 18, -36);
      lakeShape.closePath();
      const valleyLakeGeo = new THREE.ExtrudeGeometry(lakeShape, { depth: 0.45, bevelEnabled: false });
      valleyLakeGeo.rotateX(Math.PI / 2);
      const valleyLakeMesh = new THREE.Mesh(valleyLakeGeo, mats.lakeWater);
      valleyLakeMesh.position.y = 2.65;
      group.add(valleyLakeMesh);

      const baseY = 18.4; // 佛顶宫核心台地高程

      // 3. 左前方主C位：【摩尼宝珠圆穹顶 (Mani Jewel Dome) + 32窗环形石材柱廊圆鼓座 + 左外侧弧形镜面水池挑台】
      // 严格定位在左前方 (lx = -11.5, ly = baseY, lz = 2.5)
      const maniCenter = new THREE.Vector3(-11.5, baseY, 2.5);
      const maniGroup = new THREE.Group();
      maniGroup.position.copy(maniCenter);

      // (A) 左外侧与前侧环绕的【宽阔弧形深灰蓝镜面水池挑台 & 浅米白弧形外护栏】（1:1还原实景图左中侧环绕圆鼓座的弧形深色水池带！）
      const poolOuterR = 23.2;
      const poolInnerR = 16.5;
      const poolDeck = new THREE.Mesh(
        new THREE.CylinderGeometry(poolOuterR, poolOuterR + 0.8, 1.4, 56, 1, false, Math.PI * 0.45, Math.PI * 1.25),
        warmBeigeStoneMat
      );
      poolDeck.position.y = 0.7;
      poolDeck.receiveShadow = true;
      const crescentWater = new THREE.Mesh(
        new THREE.RingGeometry(poolInnerR + 0.6, poolOuterR - 0.7, 52, 1, Math.PI * 0.48, Math.PI * 1.18),
        mats.memorialDarkSlate
      );
      crescentWater.rotation.x = -Math.PI / 2;
      crescentWater.position.y = 1.43;
      const crescentWaterShimmer = new THREE.Mesh(
        new THREE.RingGeometry(poolInnerR + 0.8, poolOuterR - 0.9, 52, 1, Math.PI * 0.48, Math.PI * 1.18),
        mats.lakeWater
      );
      crescentWaterShimmer.rotation.x = -Math.PI / 2;
      crescentWaterShimmer.position.y = 1.45;
      maniGroup.add(poolDeck, crescentWater, crescentWaterShimmer);

      // 左侧伸向山林的两道平行景观石栈桥（还原实景图左侧边缘伸出的两座横向栈桥！）
      [1.0, 7.8].forEach(bz => {
        const leftBridge = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.75, 2.4), warmBeigeStoneMat);
        leftBridge.position.set(-24.2, 0.9, bz);
        maniGroup.add(leftBridge);
      });

      // (B) 摩尼宝珠底部：【环形米白石材柱廊圆鼓座（外圈整齐排列 32 个大尺寸深色矩形窗洞 + 双层挑檐环带）】
      const drumR = 16.6;
      const drumH = 4.5;
      const drumCore = new THREE.Mesh(new THREE.CylinderGeometry(drumR - 0.45, drumR - 0.25, drumH, 56), mats.darkDoor);
      drumCore.position.y = 1.2 + drumH * 0.5;
      // 上下米白石材挑檐环梁
      const drumBotBand = new THREE.Mesh(new THREE.CylinderGeometry(drumR + 0.3, drumR + 0.5, 0.9, 56), warmBeigeStoneMat);
      drumBotBand.position.y = 1.65;
      const drumMidBand = new THREE.Mesh(new THREE.CylinderGeometry(drumR + 0.25, drumR + 0.25, 0.65, 56), warmBeigeStoneMat);
      drumMidBand.position.y = 4.65;
      const drumTopCornice = new THREE.Mesh(new THREE.CylinderGeometry(drumR + 0.55, drumR + 0.35, 0.72, 56), mats.whiteMarble);
      drumTopCornice.position.y = 5.45;
      maniGroup.add(drumCore, drumBotBand, drumMidBand, drumTopCornice);

      // 圆鼓座外圈 32 根厚实的米白石材方柱（在柱间形成实景图中一圈极其醒目的深色大矩形窗洞！）
      const pillarCount = 32;
      for (let p = 0; p < pillarCount; p++) {
        const ang = (p / pillarCount) * Math.PI * 2;
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2.55, 1.05), warmBeigeStoneMat);
        pillar.position.set(Math.cos(ang) * drumR, 3.15, Math.sin(ang) * drumR);
        pillar.rotation.y = -ang + Math.PI / 2;
        pillar.castShadow = true;
        maniGroup.add(pillar);

        // 上沿小方窗洞间的短石柱
        const upperPost = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.55, 0.95), warmBeigeStoneMat);
        upperPost.position.set(Math.cos(ang) * (drumR - 0.05), 5.0, Math.sin(ang) * (drumR - 0.05));
        upperPost.rotation.y = -ang + Math.PI / 2;
        maniGroup.add(upperPost);
      }

      // (C) 摩尼宝珠圆穹顶主体：饱满浑圆的香槟金立体菱形发髻/莲花瓣球冠穹顶 (半径 16.0m，顶点高至 baseY + 18.2 = 36.6)
      const domeR = 16.0;
      const maniDomeGeo = new THREE.SphereGeometry(domeR, 56, 36, 0, Math.PI * 2, 0, Math.PI * 0.49);
      const maniDomeMesh = new THREE.Mesh(maniDomeGeo, maniDiamondMat);
      maniDomeMesh.scale.set(1.0, 0.80, 1.0); // 饱满浑圆的椭球冠比例，与实景图完全一致
      maniDomeMesh.position.y = 5.4;
      maniDomeMesh.castShadow = true;
      maniDomeMesh.receiveShadow = true;
      maniGroup.add(maniDomeMesh);

      // 在摩尼圆穹顶表面叠加 7 圈立体凸起的金色螺髻/莲瓣浮雕节点环，增强近景 3D 颗粒立体感！
      const bossGeo = new THREE.OctahedronGeometry(0.38, 1);
      for (let ring = 1; ring <= 7; ring++) {
        const phi = (ring / 8.2) * (Math.PI * 0.46);
        const yRing = 5.4 + Math.cos(phi) * (domeR * 0.80);
        const rRing = Math.sin(phi) * (domeR + 0.08);
        const count = Math.max(10, Math.round(36 * Math.sin(phi)));
        for (let k = 0; k < count; k++) {
          const theta = (k / count) * Math.PI * 2 + (ring % 2) * (Math.PI / count);
          const boss = new THREE.Mesh(bossGeo, mats.goldTrim);
          boss.scale.set(1.1, 0.65, 1.1);
          boss.position.set(Math.cos(theta) * rRing, yRing, Math.sin(theta) * rRing);
          maniGroup.add(boss);
        }
      }

      group.add(maniGroup);

      // 4. 摩尼宝珠正后方山巅：【88米九级四面唐风佛顶塔】（1:1还原 image_a07cb5.jpg 中位于圆穹顶正后方偏左的高耸九级金铜飞檐古塔！）
      const pagodaBaseY = getNiushouHeight(-9.5, -23.5);
      const fodingPagoda = new THREE.Group();
      fodingPagoda.position.set(-9.5, pagodaBaseY, -23.5);

      // 佛顶塔左前侧的米白石材山顶礼仪小广场（还原实景图中摩尼穹顶左上方、佛顶塔左侧的米白石板平台与点缀树木！）
      const upperLeftPlaza = new THREE.Mesh(new THREE.CylinderGeometry(11.5, 12.8, 3.2, 24), warmBeigeStoneMat);
      upperLeftPlaza.scale.set(1.2, 1, 0.85);
      upperLeftPlaza.position.set(-12.5, -1.2, 6.5);
      fodingPagoda.add(upperLeftPlaza);

      // 佛顶塔汉白玉台基与底层副阶
      const pagodaPlinth = new THREE.Mesh(new THREE.BoxGeometry(13.6, 2.2, 13.6), warmBeigeStoneMat);
      pagodaPlinth.position.y = 1.1;
      fodingPagoda.add(pagodaPlinth);

      // 严格雕琢【九级四面】9 层暖金铜色深出檐飞檐翘角屋顶 + 深棕红木构塔身
      for (let lv = 0; lv < 9; lv++) {
        const w = 9.8 - lv * 0.64;
        const h = 2.28;
        const y0 = 2.2 + lv * 2.22;

        const coreBody = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mats.ancientLatticeMat);
        coreBody.position.y = y0 + h * 0.5;
        coreBody.castShadow = true;

        const railBelt = new THREE.Mesh(new THREE.BoxGeometry(w + 0.9, 0.36, w + 0.9), mats.bronze);
        railBelt.position.y = y0 + 0.2;

        const roof = createChineseRoof(w + 3.5, w + 3.5, 1.25, tangPagodaGoldRoofMat, lv === 8);
        roof.position.y = y0 + h;
        fodingPagoda.add(coreBody, railBelt, roof);
      }

      // 塔顶高耸入云的鎏金相轮塔刹（直冲天际线！）
      const spireY0 = 2.2 + 9 * 2.22 + 1.0;
      const spireBowl = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.6, 1.4, 12), mats.goldTrim);
      spireBowl.position.y = spireY0;
      const spireMast = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.78, 7.2, 12), mats.goldTrim);
      spireMast.position.y = spireY0 + 3.9;
      const spirePearl = new THREE.Mesh(new THREE.SphereGeometry(0.58, 10, 10), mats.goldTrim);
      spirePearl.position.y = spireY0 + 7.7;
      fodingPagoda.add(spireBowl, spireMast, spirePearl);
      group.add(fodingPagoda);

      // 5. 右侧环抱拱起：【巨型“佛手袈裟 / 菩提叶”暖香槟玫瑰金镂空大穹顶】
      // 1:1 严格还原 image_a07cb5.jpg 的参数化曲面形态：
      // - 左内缘 (u = 0) 紧密贴合左前方摩尼宝珠圆穹顶 (center: -11.5, +2.5) 的右侧弧线，从后上方 (-8.5, 35.0, -13.5) 顺滑包络至前下方 (+3.5, 22.0, +13.5)；
      // - 主体向右侧 (u -> 1, lx -> +36) 饱满隆起成巨大的玫瑰金袈裟/菩提叶穹顶 (峰值高 Y = 38.2)；
      // - 前缘在摩尼宝珠右下前方 (u ≈ 0.26, v = 1 -> lx ≈ +8.5, lz ≈ +19.5) 优美下垂成圆润舌尖触地 (Y = 19.2)，随后向右下边缘呈 S 形波浪弧线高高扬起！
      const uSegs = 64, vSegs = 52;
      const canopyGeo = new THREE.PlaneGeometry(1, 1, uSegs, vSegs);
      const cPos = canopyGeo.attributes.position;
      const cUV = canopyGeo.attributes.uv;

      for (let i = 0; i < cPos.count; i++) {
        // u in [0, 1]: 0 = 紧贴摩尼圆穹顶右侧弧缝 (Left Seam), 1 = 最右侧外缘 (Far Right Edge)
        // v in [0, 1]: 0 = 北侧后缘 (Rear/North near Pagoda), 1 = 南侧前缘 (Front/South Scalloped Lip)
        const u = cPos.getX(i) + 0.5;
        const v = 0.5 - cPos.getY(i);

        // (1) 左边界曲线 (u = 0)：严格贴合摩尼圆穹顶 (cx=-11.5, cz=2.5, R=16.2) 的右侧球面弧线！
        const seamAngle = THREE.MathUtils.lerp(-Math.PI * 0.44, Math.PI * 0.34, v);
        const seamRadius = 15.8 - Math.sin(v * Math.PI) * 1.6;
        const leftX = -11.5 + Math.cos(seamAngle) * seamRadius;
        const leftZ = 2.5 + Math.sin(seamAngle) * seamRadius;
        // 左弧缝高度：在后上方紧贴摩尼宝珠肩部 (Y = 34.6)，沿着圆穹顶右侧弧线平滑降至前下方 (Y = 21.8)
        const leftY = THREE.MathUtils.lerp(34.6, 21.4, Math.pow(v, 1.15)) + Math.sin(v * Math.PI) * 2.2;

        // (2) 右边界曲线 (u = 1)：向右大幅舒展包络右翼山坡 (lx 延伸至 +36.5)
        const rightX = 16.0 + Math.sin(v * Math.PI * 0.85) * 20.5;
        const rightZ = THREE.MathUtils.lerp(-18.5, 5.5, v);
        const rightY = 21.5 + Math.sin(v * Math.PI) * 3.8;

        // (3) 水平坐标 (cx, cz) 插值 + 前缘左下侧标志性的【圆润下垂舌尖凸出 (Front Dipping Tongue at u ≈ 0.24, v = 1)】
        const tongueBell = Math.exp(-Math.pow((u - 0.24) / 0.19, 2)) * Math.pow(v, 1.6);
        const rightArchScoop = Math.exp(-Math.pow((u - 0.72) / 0.24, 2)) * Math.pow(v, 1.4);

        let cx = THREE.MathUtils.lerp(leftX, rightX, Math.pow(u, 0.88));
        let cz = THREE.MathUtils.lerp(leftZ, rightZ, u)
                 + tongueBell * 9.5          // 前缘在左下侧向前伸出圆润舌尖 (lz -> +20.5)
                 - rightArchScoop * 3.2      // 右下侧前缘微向内收弧
                 - Math.sin(u * Math.PI) * (1 - v) * 6.5; // 后缘向北饱满外鼓

        // (4) 垂直高度场 cy：中央偏右上方饱满隆起 (峰值 Y = 38.5)，前缘左下舌尖下垂触地 (Y = 19.0)，右下缘呈波浪拱起 (Y = 25.5)
        const baseShellY = THREE.MathUtils.lerp(leftY, rightY, u);
        // 穹隆主拱高度
        const domeBulge = Math.sin(u * Math.PI * 0.88) * Math.sin(v * Math.PI * 0.82) * 14.2;
        // 后上方饱满肩部隆起（呼应照片中佛顶塔前右侧高高隆起的饱满金顶）
        const upperShoulder = Math.sin(u * Math.PI * 0.75) * Math.pow(1 - v, 0.85) * 7.8;
        // 前缘 S 形波浪曲边：在 u ≈ 0.24 处下垂触地 (dip = -6.8)，在 u ≈ 0.68 处向上拱起成优雅眉弓 (arch = +4.2)
        const frontLipDip = -tongueBell * 6.8 + rightArchScoop * 4.2;

        let cy = baseShellY + domeBulge + upperShoulder + frontLipDip;
        cPos.setXYZ(i, cx, Math.max(18.8, cy), cz);
        cUV.setXY(i, u, 1 - v);
      }
      canopyGeo.computeVertexNormals();

      // U形庭院左侧醒目的绿色琉璃坡顶入口门头（还原实景图中U形庭院左前角的绿顶门廊！）
      const greenEntryBox = new THREE.Mesh(new THREE.BoxGeometry(6.5, 2.2, 3.6), warmBeigeStoneMat);

      function createNiushouLushTree(scale = 1.0, seed = 0) {
        const t = new THREE.Group();
        const tr = new THREE.Mesh(sharedGeos.trunkCyl, mats.treeTrunk);
        tr.position.y = 0.9;
        t.add(tr);
        const mMat = nsFoliageMats[seed % nsFoliageMats.length];
        [[0, 2.7, 0, 1.45, 1.0, 1.45], [-0.7, 2.3, 0.45, 1.08, 0.85, 1.08], [0.7, 2.3, -0.45, 1.08, 0.85, 1.08]].forEach(([ox, oy, oz, sx, sy, sz]) => {
          const p = new THREE.Mesh(sharedGeos.wutongPuff, mMat);
          p.position.set(ox, oy, oz);
          p.scale.set(sx, sy, sz);
          p.castShadow = true;
          t.add(p);

        t.scale.setScalar(scale);
        return t;

      for (let i = 0; i < 280; i++) {
        const rRatio = Math.sqrt((i + 0.5) / 280);

        const tx = Math.cos(theta) * rRatio * 98;
        const tz = Math.sin(theta) * rRatio * 82;

        // 严格避开左前方摩尼圆穹顶、右侧大穹顶、正后方佛顶塔、前景多层挑台与右后方山谷湖泊
        if (Math.hypot(tx - (-11.5), tz - 2.5) < 23.5) continue;

        if (Math.hypot(tx - (-9.5), tz - (-23.5)) < 14) continue;
        if (tx > -18 && tx < 28 && tz >= 16 && tz < 33) continue;
        if (tx > 12 && tx < 56 && tz > -55 && tz < -31) continue;

        const ty = getNiushouHeight(tx, tz);
        const sc = 1.02 + (i % 4) * 0.18;
        const tree = i % 4 === 0 ? createChinesePine(sc, i) : createNiushouLushTree(sc, i);
        tree.position.set(tx, ty - 0.25, tz);
        group.add(tree);
      }

      scene.add(group);

    // ============================================================================
    // 11B. 新增地标十四 ~ 二十：紫峰大厦、南京南站、南京青奥体育馆、南京城墙(中华门)、老山、方山、禄口机场
    // ============================================================================
    const animatedHSRTrains = [];

    // -------------------------------------------------------------------------
    // 地标十四：【紫峰大厦 (450米江苏第一高楼) & 鼓楼公园古今同框】 (X = -65, Z = -28)
    // 1:1 真实细节：
    // - SOM设计（迪拜塔同款主创）：三角折面双曲玻璃幕墙柱体 + 阶梯式蟠龙退台缺口
    // - 外立面密集的竖向银白色锯齿状鱼鳞金属遮阳龙骨 (Vertical Silver Fins) 与水平层间灯带
    // - 72层观光层内凹发光环廊、顶部斜切阶梯塔冠与直插云霄的超高纯白通信尖塔（总高 108 单位，全图最高峰！）
    // - 紧邻北侧的明代【鼓楼红墙重檐歇山碑楼】，还原南京最经典的“鼓楼与紫峰古今同框”机位
    // -------------------------------------------------------------------------
    function buildZifengTowerAndGulou() {
      const group = new THREE.Group();
      const ZX = 265, ZZ = 85;
      group.position.set(ZX, 0, ZZ);

      // 1. 鼓楼环岛广场与6层弧形石材+玻璃商业裙楼 (Curved Podium)

      // 弧形裙楼群（环抱主塔东南西三侧）
      const podiumMain = new THREE.Mesh(new THREE.CylinderGeometry(14.5, 16.0, 9.2, 6, 1, false, -0.4, Math.PI * 1.35), mats.zifengGlassMat);
      podiumMain.position.set(0, 4.6, 2.5);
      podiumMain.castShadow = true;
      const podiumCap = new THREE.Mesh(new THREE.CylinderGeometry(15.0, 15.0, 0.8, 6, 1, false, -0.4, Math.PI * 1.35), mats.zifengFinMat);
      podiumCap.position.set(0, 9.4, 2.5);
      group.add(podiumMain, podiumCap);

      // 2. 紫峰大厦灵魂造型：【高低错落咬合的双三角扇形弧面束筒 (Interlocking Bundled Curved-Triangular Prisms)】
      // Helper: 生成圆角弧边等腰三角棱柱 (Curved-Side Triangular Prism)
      function createCurvedTriangularPrism(botR, topR, height, mat, rotOffset = 0) {
        const geo = new THREE.CylinderGeometry(topR, botR, height, 36, 12);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i), vz = pos.getZ(i);
          const ang = Math.atan2(vz, vx) + rotOffset;
          // 饱满的弧边三角形截面 (Reuleaux / Curved Triangle Section)，绝非三叶梅花柱
          const triFactor = 0.82 + 0.22 * Math.cos(ang * 3) - 0.04 * Math.cos(ang * 6);
          pos.setX(i, vx * triFactor);
          pos.setZ(i, vz * triFactor);
        }
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      // (A) 东南外侧副束筒 (Outer South-East Wing Prism)：从 Y=0.8 升至 72层观光厅 (Y=66)，在此形成标志性的【72层水平大退台缺口】！
      const wingPrism = createCurvedTriangularPrism(10.2, 8.8, 65.2, mats.zifengGlassMat, 0.0);
      wingPrism.position.set(2.2, 0.8 + 32.6, 2.0);
      group.add(wingPrism);

      // 72层云端观光层退台纯白平台盖板与内凹全景发光玻璃环 (The Iconic 72F Setback Observatory Notch at Y=66~70)
      const setbackLedge = createCurvedTriangularPrism(9.1, 9.1, 1.2, mats.zifengFinMat, 0.0);
      setbackLedge.position.set(2.2, 66.2, 2.0);
      const obsGlassNotch = createCurvedTriangularPrism(8.2, 8.2, 3.2, mats.zifengCrownGlow, 0.0);
      obsGlassNotch.position.set(1.2, 68.4, 1.1);
      group.add(setbackLedge, obsGlassNotch);

      // (B) 中间过渡束筒 (Mid-Tier Interlocking Prism)：从 Y=0.8 升至 82层 (Y=82)，形成第二道阶梯退台！
      const midPrism = createCurvedTriangularPrism(9.4, 7.6, 81.2, mats.zifengGlassMat, Math.PI / 3);
      midPrism.position.set(0.4, 0.8 + 40.6, 0.4);
      const midLedge = createCurvedTriangularPrism(7.8, 7.8, 1.0, mats.zifengFinMat, Math.PI / 3);
      midLedge.position.set(0.4, 82.2, 0.4);
      group.add(midPrism, midLedge);

      // (C) 西北主核心高耸束筒 (Main Taller North-West Core Prism)：从底部一气呵成直冲 Y=95，高出副筒整整 29 单位！
      const mainCorePrism = createCurvedTriangularPrism(8.8, 6.6, 94.2, mats.zifengGlassMat, Math.PI);
      mainCorePrism.position.set(-1.6, 0.8 + 47.1, -1.4);
      const mainCoreLedge = createCurvedTriangularPrism(6.8, 6.8, 1.1, mats.zifengFinMat, Math.PI);
      mainCoreLedge.position.set(-1.6, 95.2, -1.4);
      group.add(mainCorePrism, mainCoreLedge);

      // (D) 竖向锯齿状银白色鱼鳞金属龙骨凹槽 (Signature Vertical Silver Sawtooth Spines along the Interlocking Seams)
      [
        { x: 4.8, z: -2.6, h: 82, rot: 0.5 },
        { x: -3.2, z: 4.6, h: 82, rot: -0.8 },
        { x: -5.8, z: -4.2, h: 95, rot: 2.2 },
        { x: 5.6, z: 4.8, h: 66, rot: -0.4 }
      ].forEach(sp => {
        const spineBar = new THREE.Mesh(new THREE.BoxGeometry(0.95, sp.h, 1.65), mats.zifengFinMat);
        spineBar.position.set(sp.x, 0.8 + sp.h / 2, sp.z);
        spineBar.rotation.y = sp.rot;
        group.add(spineBar);
        // 锯齿阶梯鱼鳞节点
        for (let sy = 6; sy < sp.h; sy += 4.5) {
          const tooth = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.65, 2.0), mats.whiteMarble);
          tooth.position.set(sp.x, 0.8 + sy, sp.z);
          tooth.rotation.y = sp.rot;
          group.add(tooth);
        }
      });

      // (E) 密集的水平银白玻璃幕墙层间环带 (26 Horizontal Curtain-Wall Spandrel Rings)
      for (let ly = 4; ly <= 92; ly += 3.6) {
        const isHigh = ly > 66;
        const isVeryHigh = ly > 82;
        const rRing = isVeryHigh ? 5.6 : (isHigh ? 6.8 : 8.6);
        const ox = isVeryHigh ? -1.6 : (isHigh ? -0.6 : 0.6);
        const oz = isVeryHigh ? -1.4 : (isHigh ? -0.5 : 0.5);
        const hBand = createCurvedTriangularPrism(
          rRing, rRing, 0.24,
          (ly === 40 || ly === 65.6 || ly === 81.6) ? mats.zifengCrownGlow : mats.zifengFinMat,
          isVeryHigh ? Math.PI : 0
        );
        hBand.position.set(ox, ly, oz);
        group.add(hBand);
      }

      // 3. 顶部阶梯式发光玻璃灯笼塔冠与偏心耸立的【450米超高纯白通信天线尖塔】 (Y = 95.5 -> 132)
      const lanternCrown1 = createCurvedTriangularPrism(5.2, 4.2, 6.5, mats.zifengCrownGlow, Math.PI);
      lanternCrown1.position.set(-1.6, 98.8, -1.4);
      const lanternCrown2 = createCurvedTriangularPrism(3.4, 2.2, 5.2, mats.zifengFinMat, Math.PI);
      lanternCrown2.position.set(-1.8, 104.5, -1.6);
      group.add(lanternCrown1, lanternCrown2);

      // 偏心矗立在西北最高筒顶端的纯白通信桅杆尖塔 (Iconic Off-Center Tall White Mast Antenna)
      const mastBase = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 1.35, 8.5, 12), mats.whiteMarble);
      mastBase.position.set(-1.8, 111.2, -1.6);
      const mastSpire = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.52, 18.5, 10), mats.whiteMarble);

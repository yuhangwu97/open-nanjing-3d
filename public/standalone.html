      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#0f2942');
      grad.addColorStop(0.22, '#1e4e79');
      grad.addColorStop(0.75, '#38bdf8');
      grad.addColorStop(1, '#0c2d48');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // 顶部深色钢桁架阴影带

      ctx.strokeStyle = 'rgba(226, 232, 240, 0.55)';
      ctx.lineWidth = 3;
      for (let x = 0; x <= 512; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();

      tex.needsUpdate = true;
      return tex;

      [

    // - 西侧半敞口波浪形【青奥体育场】（内设翠绿足球场与蓝色塑胶跑道）

      for (let b = 1; b <= 4; b++) {

      const wingRoofGeo = new THREE.SphereGeometry(17.5, 40, 24, 0, Math.PI * 2, 0, Math.PI * 0.52);
      const wPos = wingRoofGeo.attributes.position;
      for (let i = 0; i < wPos.count; i++) {
        let vx = wPos.getX(i) * 1.38;
        let vy = wPos.getY(i) * 0.52;
        let vz = wPos.getZ(i) * 1.05;
        // 东西双翼向上掀起 (Gull-wing lift)，南北方向呈S流线起伏并在南端悬挑成鸥喙
        const wingLift = Math.pow(Math.abs(vx) / 22, 1.6) * 5.8 - Math.cos((vz / 18) * Math.PI) * 1.6;
        if (vz > 8) {
          vx *= (1 - (vz - 8) * 0.035); // 南端收拢成海鸥喙尖
          vy += (vz - 8) * 0.25;

        wPos.setXYZ(i, vx, vy + 7.2 + wingLift * 0.55, vz);
      }
      wingRoofGeo.computeVertexNormals();
      const gullRoof = new THREE.Mesh(wingRoofGeo, mats.silverDome);
      gullRoof.castShadow = true;
      const gullWire = new THREE.Mesh(wingRoofGeo.clone(), mats.zahaDiagridWire);
      gullWire.scale.set(1.01, 1.01, 1.01);
      arenaGroup.add(gullRoof, gullWire);

      blueTrack.position.y = 0.28;
      stadiumGroup.add(turf, blueTrack);

      // C字形海浪悬挑白玉屋盖
      const crescentGeo = new THREE.TorusGeometry(14.5, 3.8, 12, 36, Math.PI * 1.35);
      crescentGeo.rotateX(Math.PI / 2);
      crescentGeo.rotateZ(0.4);
      const crescentRoof = new THREE.Mesh(crescentGeo, mats.zahaWhiteFacade);
      crescentRoof.scale.set(1.18, 0.88, 0.85);
      crescentRoof.position.y = 5.5;
      crescentRoof.castShadow = true;
      stadiumGroup.add(crescentRoof);

    // 1:1 真实细节：
    // - 世界现存规模最大的堡垒式城门瓮城：由南向北依次贯穿【四道拱券城门洞】与【三道矩形内瓮城院落】

    // - 东西两侧设有宽阔坡道式【登城马道】（武将可策马直登城头），顶部环绕600年青砖【凹凸雉堞垛口】与重檐歇山朱红【中华门敌楼】
    // - 南侧外秦淮河护城河与三孔石拱【长干桥】

    function buildMingCityWallZhonghuamen() {
      const group = new THREE.Group();

      // 三道内瓮城院落、四重券门、27个藏兵洞与左右登城马道全部朝北（-Z，城内方向）延伸！
      const wallH = 11.5;
      [-17.5, 17.5].forEach(sideX => {
        const sideWall = new THREE.Mesh(new THREE.BoxGeometry(4.2, wallH, 32), mats.ancientBrickMat);
        sideWall.position.set(sideX, wallH / 2, 0);

        sideWall.receiveShadow = true;

      // 由南（城外侧主城门 Z=+14.5）向北（城内侧内瓮城门 Z=+5.0 -> -4.5 -> -14.0）依次贯穿四道城门横墙
      [14.5, 5.0, -4.5, -14.0].forEach((gz, gIdx) => {

        const gateArch = new THREE.Mesh(new THREE.BoxGeometry(4.6, 6.2, thickness + 0.4), mats.darkDoor);
        gateArch.position.set(0, 3.1, gz);

      for (let bx = -18.5; bx <= 18.5; bx += 2.6) {

          merlon.position.set(bx, wallH + 0.65, bz);
          group.add(merlon);

        group.add(horseRamp);

        // 与南侧外立面 (Z = +14.5) 齐平延伸的环城明城墙，凸显“瓮城在城墙里面（北侧城内）”的防御格局
        const wingWall = new THREE.Mesh(new THREE.BoxGeometry(42, 9.5, 4.8), mats.mingBrick);

          wMerlon.position.set(side * mx, 10.1, 16.5);

      laoshanBasePad.position.set(0, 0.55, 0);

      group.add(laoshanBaseRim, laoshanBasePad);

      // 1. 巍峨百里老山多峰山脉地形网格 (宽 148m、长 490m，主峰大刺山高达 78 单位！)
      const tGeo = new THREE.PlaneGeometry(148, 490, 52, 128);
      tGeo.rotateX(-Math.PI / 2);
      const pos = tGeo.attributes.position;
      const cols = new Float32Array(pos.count * 3);
      const cBase = new THREE.Color(0x1b3b1e);
      const cMid = new THREE.Color(0x15803d);
      const cRidge = new THREE.Color(0x4d7c0f);
      const cRock = new THREE.Color(0x64748b);
      const cAutumn = new THREE.Color(0xd97706);

      // 9座主次交错的雄伟山峰群（天花山、老鹰山、狮子岭、平山、大刺山最高峰、龙洞山、胡家山、天井山、横山）
      const stripPeaks = [
        { x: -10, z: -195, h: 52, rx: 32, rz: 42 },
        { x: 14,  z: -140, h: 60, rx: 35, rz: 44 },
        { x: -12, z: -85,  h: 66, rx: 36, rz: 46 },
        { x: -4,  z: -32,  h: 78, rx: 40, rz: 50 }, // 大刺山最高主峰（状元塔）
        { x: 18,  z: 8,    h: 58, rx: 32, rz: 40 }, // 东翼副峰
        { x: 6,   z: 35,   h: 68, rx: 38, rz: 46 }, // 鹰山峰
        { x: -8,  z: 92,   h: 62, rx: 36, rz: 44 }, // 狮子岭（兜率寺）
        { x: 10,  z: 148,  h: 56, rx: 34, rz: 42 },
        { x: -4,  z: 198,  h: 46, rx: 30, rz: 38 }
      ];

      function calcLaoshanStripH(vx, vz) {
        let h = 0;
        const spineX = Math.sin(vz * 0.018) * 11.0;
        const distFromSpine = Math.abs(vx - spineX);
        const endTaper = Math.sin(THREE.MathUtils.clamp((vz + 238) / 476, 0, 1) * Math.PI);
        h += 32 * endTaper * Math.exp(-(distFromSpine * distFromSpine) / (2 * 28 * 28));

        for (let k = 0; k < stripPeaks.length; k++) {
          const pk = stripPeaks[k];
          const d = Math.hypot((vx - pk.x) / pk.rx, (vz - pk.z) / pk.rz);
          h += pk.h * 0.68 * Math.exp(-(d * d) * 1.12);
        }

        if (h > 2.5) {
          h += (Math.sin(vx * 0.11 + vz * 0.06) * 3.6 + Math.cos(vz * 0.09 - vx * 0.08) * 2.8) * Math.min(1, h / 24);
        }
        return Math.max(0, h);
      }

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i), vz = pos.getZ(i);
        const rawY = calcLaoshanStripH(vx, vz);
        const vy = rawY < 1.2 ? 1.18 : rawY + 1.15;
        pos.setY(i, vy);
        const c = new THREE.Color().copy(cBase).lerp(vy > 42 ? cRidge : cMid, Math.min(1, vy / 68));
        if (vy > 58) c.lerp(cRock, Math.min(0.65, (vy - 58) / 28));
        if (Math.sin(vx * 0.10 + vz * 0.08) > 0.38 && vy < 40) c.lerp(cAutumn, 0.45);
        cols[i * 3] = c.r;
        cols[i * 3 + 1] = c.g;
        cols[i * 3 + 2] = c.b;
      }
      tGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      tGeo.computeVertexNormals();
      const mountain = new THREE.Mesh(
        tGeo,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.86 })
      );
      mountain.castShadow = true;
      mountain.receiveShadow = true;
      group.add(mountain);

      // 喀斯特山崖巨石簇
      [[-18, -45, 7.5], [22, -25, 6.8], [-16, 48, 7.0], [18, 85, 6.2], [-12, -135, 6.5]].forEach(([rx, rz, rs]) => {
        const ry = calcLaoshanStripH(rx, rz) + 1.15;
        const crag = new THREE.Mesh(new THREE.DodecahedronGeometry(rs, 1), mats.mingStoneBase);
        crag.scale.set(1.25, 0.8, 0.95);
        crag.position.set(rx, ry - 1.0, rz);
        group.add(crag);
      });

      // 2. 大刺山最高主峰之巅：五层八角飞檐【老山森林观景塔 / 状元塔】 (X = -4, Z = -32)
      const mainH = calcLaoshanStripH(-4, -32) + 1.15;
      const forestPagoda = new THREE.Group();
      forestPagoda.position.set(-4, mainH - 0.8, -32);
      const pPlinth = new THREE.Mesh(new THREE.CylinderGeometry(6.8, 8.0, 2.4, 8), mats.whiteMarble);
      pPlinth.position.y = 1.2;
      forestPagoda.add(pPlinth);
      for (let lv = 0; lv < 5; lv++) {
        const r = 4.6 - lv * 0.52;
        const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 2.8, 8), mats.vermilionRed);
        body.position.y = 2.4 + lv * 2.8 + 1.4;
        const roof = createChineseRoof(r * 2.45, r * 2.45, 1.45, mats.greenGlaze, lv === 4);
        roof.position.y = 2.4 + (lv + 1) * 2.8;
        forestPagoda.add(body, roof);
      }
      group.add(forestPagoda);

      // 3. 狮子岭千年古刹【兜率寺】（三进红墙金瓦禅院，Z = 92）
      const templeH = calcLaoshanStripH(-8, 92) + 1.15;
      const temple = new THREE.Group();
      temple.position.set(-8, templeH - 0.8, 92);
      const tWall = new THREE.Mesh(new THREE.BoxGeometry(15, 4.4, 11), mats.vermilionRed);
      tWall.position.y = 2.2;
      const tRoof = createChineseRoof(18.0, 13.5, 2.8, mats.imperialYellowGlaze, true);
      tRoof.position.y = 4.4;
      temple.add(tWall, tRoof);
      group.add(temple);

      // 4. 鹰山八角森林瞭望亭 (Z = 35) 与 东麓网红美丽乡村【不老村白墙黛瓦村落 & 老山石牌坊】(X = 52, Z = 15)
      const pavH = calcLaoshanStripH(6, 35) + 1.15;
      const eaglePav = new THREE.Group();
      eaglePav.position.set(6, pavH - 0.6, 35);
      const epCol = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 3.0, 3.8, 8), mats.vermilionRed);
      epCol.position.y = 1.9;
      const epRoof = createChineseRoof(7.2, 7.2, 2.3, mats.goldTrim, true);
      epRoof.position.y = 3.8;
      eaglePav.add(epCol, epRoof);
      group.add(eaglePav);

      // 东麓山脚【不老村】江南院落与【老山国家森林公园】迎宾石牌坊
      [-25, 0, 25].forEach((vz, idx) => {
        const cottage = new THREE.Group();
        cottage.position.set(54, 1.1, vz);
        const cBody = new THREE.Mesh(new THREE.BoxGeometry(8.5, 4.2, 6.5), mats.whiteMarble);
        cBody.position.y = 2.1;
        const cRoof = createChineseRoof(10.2, 8.0, 1.9, mats.darkGreyTile, false);
        cRoof.position.y = 4.2;
        cottage.add(cBody, cRoof);
        group.add(cottage);
      });

      // 5. 纵贯整条老山东坡的【七珍线彩虹森林盘山公路】（长 420 单位）
      const roadPts = [];
      for (let i = 0; i <= 32; i++) {
        const u = i / 32;
        const rz = -205 + u * 410;
        const rx = 22 + Math.sin(u * Math.PI * 6) * 10;
        roadPts.push(new THREE.Vector3(rx, calcLaoshanStripH(rx, rz) + 1.75, rz));
      }
      const forestRoad = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(roadPts), 90, 1.35, 6, false),
        mats.aotiCrimsonArch
      );
      forestRoad.scale.set(1, 0.22, 1);
      group.add(forestRoad);

      // 6. 漫山遍野的苍松、翠竹与深秋红枫林海 (180 棵)
      for (let t = 0; t < 180; t++) {
        const tz = -220 + ((t * 31) % 440);
        const tx = ((t * 19) % 88) - 44;
        const ty = calcLaoshanStripH(tx, tz) + 1.15;
        if (ty < 3.0 || ty > 64) continue;
        const tree = t % 3 === 0 ? createWutongTree(1.05, t) : createChinesePine(1.15, t);
        tree.position.set(tx, ty - 0.2, tz);
        group.add(tree);
      }

      scene.add(group);
    }

    function buildFangshanVolcanoAndLeaningPagoda() {
      // -------------------------------------------------------------------------
      // 地标十九：【江宁方山（实景航拍图一 1:1 复刻：平顶翠绿茶园火山台地 + 白色球形气象雷达站 + 依山层叠定林寺明黄琉璃瓦建筑群 & 斜塔）】
      // 严格对照实景航拍图一 (image_9d60e7.jpg) 重构：
      // 1. 山体与山顶：郁郁葱葱的深翠森林平顶火山山脉，山顶左上方平缓台地铺设整齐的翠绿茶园垄带，并矗立着醒目的【白色球形气象雷达站圆顶】！
      // 2. 左上高台寺院建筑群：依山势筑起高大青石护坡挡墙与叠水瀑布墙，高台之上耸立【三层重檐明黄琉璃瓦万佛阁/藏经楼】（带黄色双拱基座），下方衔接白墙灰瓦现代禅修院落。
      // 3. 中下层核心定林寺建筑群：依山谷台地层叠展开——中央为【重檐歇山顶明黄琉璃瓦大雄宝殿】，两侧对称排布多座【黄墙明黄琉璃瓦配殿、钟鼓楼與回廊】，前排为【白墙黑瓦江南山门殿与鲜红立柱玻璃连廊】及石板广场。
      // 4. 定林寺斜塔与盘山路：东侧山腰林间矗立倾斜 7.59° 的南宋七级八角【定林寺斜塔】，两侧山坡蜿蜒盘山公路，漫山遍野覆盖 200+ 棵苍翠森林！
      // -------------------------------------------------------------------------
      const group = new THREE.Group();
      const FX = 455, FZ = 405;
      group.scale.setScalar(1.12);
      group.position.set(FX, 0, FZ);

      // 1. 方山平顶翠绿森林火山地形网格（北高南缓，形成供定林寺依山层叠筑台的天然山谷坡面！）
      const fsGeo = new THREE.PlaneGeometry(165, 165, 56, 56);
      fsGeo.rotateX(-Math.PI / 2);
      const fsPos = fsGeo.attributes.position;
      const fsCols = new Float32Array(fsPos.count * 3);
      const cDeepForest = new THREE.Color(0x14532d);
      const cLushGreen = new THREE.Color(0x15803d);
      const cTeaTerrace = new THREE.Color(0x4d7c0f);

      function getFangshanSlopeH(lx, lz) {
        // 北侧与左上侧为高耸平顶死火山台地 (lz < -8, H ≈ 38)，向南顺坡层叠而下至山麓寺院群 (lz: -5 -> +55)
        const radial = Math.hypot(lx * 0.88, (lz + 10) * 0.85);
        let h = 40 * Math.exp(-Math.pow(Math.max(0, radial - 28) / 42, 1.75));
        // 山顶西北部平顶茶园平台 (lx < 5, lz < -8)
        if (lx < 12 && lz < -6 && radial < 34) {
          h = Math.max(h, 36.5 - Math.max(0, radial - 22) * 0.4);
        }
        // 中南坡寺院三级台地切削（让建筑稳稳坐落在层叠山腰平台上）
        if (Math.abs(lx) < 36 && lz > -4 && lz < 52) {
          const slopeT = THREE.MathUtils.clamp((lz - (-4)) / 56, 0, 1);
          const steppedH = THREE.MathUtils.lerp(24.0, 2.5, slopeT);
          const blend = THREE.MathUtils.smoothstep(Math.abs(lx), 22, 38);
          h = THREE.MathUtils.lerp(steppedH, h, blend);
        }
        if (h > 2.0) {
          h += Math.sin(lx * 0.12 + lz * 0.10) * 1.1;
        }
        return Math.max(0.5, h);
      }

      for (let i = 0; i < fsPos.count; i++) {
        const vx = fsPos.getX(i), vz = fsPos.getZ(i);
        const vy = getFangshanSlopeH(vx, vz);
        fsPos.setY(i, vy);

        const c = new THREE.Color();
        if (vy > 34 && vx < 10 && vz < -6) {
          // 山顶翠绿茶园梯田条纹
          const stripe = Math.sin(vz * 1.6) > 0 ? 0.25 : 0.0;
          c.copy(cLushGreen).lerp(cTeaTerrace, 0.55 + stripe);
        } else {
          const n = Math.sin(vx * 0.09 + vz * 0.08) * 0.5 + 0.5;
          c.copy(cDeepForest).lerp(cLushGreen, n * 0.75);
        }
        fsCols[i * 3] = c.r;
        fsCols[i * 3 + 1] = c.g;
        fsCols[i * 3 + 2] = c.b;
      }
      fsGeo.setAttribute('color', new THREE.BufferAttribute(fsCols, 3));
      fsGeo.computeVertexNormals();
      const fsMountain = new THREE.Mesh(
        fsGeo,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.86 })
      );
      fsMountain.castShadow = true;
      fsMountain.receiveShadow = true;
      group.add(fsMountain);

      // 2. 图一左上角山顶平顶茶园与标志性的【白色球形气象雷达站圆顶】(White Spherical Radar Dome on Summit Plateau)
      const summitY = getFangshanSlopeH(-18, -24);
      const radarStation = new THREE.Group();
      radarStation.position.set(-18, summitY, -24);
      const radarTowerBase = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 3.2, 16), mats.whiteMarble);
      radarTowerBase.position.y = 1.6;
      const radarSphereDome = new THREE.Mesh(new THREE.SphereGeometry(2.35, 24, 20), mats.zahaWhiteFacade);
      radarSphereDome.position.y = 4.6;

      // 山顶翠绿茶园垄带立体模型 (Neat Green Tea Plantation Rows on Summit)
      for (let tz = -34; tz <= -12; tz += 2.6) {

        teaRow.position.set(-12, getFangshanSlopeH(-12, tz) + 0.25, tz);
        group.add(teaRow);
      }

      // 3. 图一左侧高台建筑群：【三层重檐明黄琉璃瓦万佛阁/藏经楼 + 黄色双拱基座 + 叠水瀑布高挡墙 + 白墙灰瓦现代禅院】
      const upperWestPav = new THREE.Group();

      for (let lv = 0; lv < 3; lv++) {

      // 高阁下方衔接的白墙灰瓦现代禅修院落（还原图一左下侧白墙平顶与灰瓦斜顶院落）
      const whiteCourtyard = new THREE.Mesh(new THREE.BoxGeometry(16, 3.6, 12), mats.whiteMarble);

      // 4. 图一中上层台地：【第二座三层黄琉璃瓦楼阁 + 对称黄瓦殿宇院落】 (X = -4, Z = -2)
      const upperMidCompound = new THREE.Group();

      // 中庭黄墙黄瓦殿宇与左右配殿

      midHallBody.position.set(2, 3.5 + 2.1, 2);

      [-7, 10].forEach(sx => {
        const sWing = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.4, 8.5), mats.jimingWallMat);
        sWing.position.set(sx, 3.5 + 1.7, 5);

        sRoof.position.set(sx, 3.5 + 3.4, 5);
        upperMidCompound.add(sWing, sRoof);
      });
      group.add(upperMidCompound);

      // 5. 图一前景核心：【定林寺主院落（重檐黄瓦大雄宝殿 + 左右黄墙金瓦配殿群 + 前排白墙黛瓦山门殿与红柱玻璃连廊）】 (X = 4, Z = 28)
      const lowerMainTemple = new THREE.Group();
      const lmY = getFangshanSlopeH(4, 28);
      lowerMainTemple.position.set(4, lmY, 28);

      const mainCourtSlab = new THREE.Mesh(new THREE.BoxGeometry(42, 3.2, 32), mats.platformInlay);
      mainCourtSlab.position.y = 1.6;

      const daxiongBody = new THREE.Mesh(new THREE.BoxGeometry(14.5, 5.8, 10.2), mats.ancientLatticeMat);

      // 殿前黄墙明黄瓦前殿与左右对称黄瓦配殿群（还原图一前景密布的黄色琉璃瓦屋顶群！）
      [

        for (let p = 0; p < cfg.puffs; p++) {
          const r1 = seededRand(idx * 31 + p * 7);
          const r2 = seededRand(idx * 47 + p * 13);
          const r3 = seededRand(idx * 73 + p * 19);
          const angle = (p / cfg.puffs) * Math.PI * 2 + r1 * 1.2;
          const dist = p === 0 ? 0 : (6 + r2 * 14);
          const px = Math.cos(angle) * dist * cfg.stretchX;
          const pz = Math.sin(angle) * dist * 0.78;

          const rx = (p === 0 ? 15 : 8 + r1 * 8) * (1 + (cfg.stretchX - 1) * 0.35);
          const ry = (p === 0 ? 7.5 : 4.2 + r2 * 4.5);
          const rz = (p === 0 ? 12 : 7 + r3 * 6.5);

          const topPuff = new THREE.Mesh(puffGeo, cloudMatGlobal);
          topPuff.position.set(px, py, pz);
          topPuff.scale.set(rx, ry, rz);
          topPuff.rotation.set(r1 * 0.5, r2 * Math.PI, r3 * 0.4);
          cloud.add(topPuff);

    function buildCityTrafficAndPedestrians() {

        const halfL = isBus ? 2.32 : 1.52;

    function rebuild3DRouteSpline(routeId, render3DLine = showRoute3DLines) {
      while (routeCurveGroup.children.length > 0) {
        routeCurveGroup.remove(routeCurveGroup.children[0]);
      }
      routePulseMeshes = [];
      activeRouteCurve = null;

      if (!routeId || routeId === 'none' || !ROUTES_DB[routeId]) {
        setRoutePanelOpen(false);
        updatePinRouteBadges([]);
        return;
      }

      const route = ROUTES_DB[routeId];
      const stops = route.stops;

      // 全景全览 (routeId === 'all') 时不显示 3D 连接线，仅在点击其余主题路线时渲染 3D 发光流光连接线、地面光环与动态脉冲球
      const shouldDraw3DSpline = render3DLine && (routeId !== 'all') && stops.length >= 2;
      if (shouldDraw3DSpline) {
        const curvePts = [];
        for (let i = 0; i < stops.length; i++) {
          const pA = SPOTS_DB[stops[i]].routeNodePos.clone();
          curvePts.push(pA);
          if (i < stops.length - 1) {
            const pB = SPOTS_DB[stops[i + 1]].routeNodePos.clone();
            const mid = pA.clone().lerp(pB, 0.5);
            const dist = pA.distanceTo(pB);
            mid.y = Math.max(pA.y, pB.y) + Math.min(36, 12 + dist * 0.055);
            curvePts.push(mid);
          }
        }
        activeRouteCurve = new THREE.CatmullRomCurve3(curvePts);

        const coreTube = new THREE.Mesh(
          new THREE.TubeGeometry(activeRouteCurve, stops.length * 20, 0.95, 8, false),
          new THREE.MeshBasicMaterial({ color: route.color })
        );
        const haloTube = new THREE.Mesh(
          new THREE.TubeGeometry(activeRouteCurve, stops.length * 20, 2.2, 8, false),
          new THREE.MeshBasicMaterial({ color: route.color, transparent: true, opacity: 0.28 })
        );
        routeCurveGroup.add(coreTube, haloTube);

        stops.forEach((sKey) => {
          const np = SPOTS_DB[sKey].routeNodePos;
          const groundRing = new THREE.Mesh(
            new THREE.RingGeometry(4.5, 6.8, 28),
            new THREE.MeshBasicMaterial({ color: route.color, side: THREE.DoubleSide, transparent: true, opacity: 0.78 })
          );
          groundRing.rotation.x = -Math.PI / 2;
          groundRing.position.set(np.x, 1.2, np.z);
          const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(0.45, 0.45, np.y, 8),
            new THREE.MeshBasicMaterial({ color: route.color, transparent: true, opacity: 0.45 })
          );
          beam.position.set(np.x, np.y * 0.5, np.z);
          routeCurveGroup.add(groundRing, beam);
        });

        const pulseCount = Math.max(6, stops.length);
        const pulseGeo = new THREE.SphereGeometry(2.1, 12, 12);
        const pulseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let p = 0; p < pulseCount; p++) {
          const pm = new THREE.Mesh(pulseGeo, pulseMat);
          routeCurveGroup.add(pm);
          routePulseMeshes.push({ mesh: pm, offset: p / pulseCount });
        }
      }

      document.getElementById('route-title').textContent = route.title;
      document.getElementById('route-subtitle').textContent = route.subtitle;
      document.getElementById('route-badge').textContent = `${stops.length} 站`;
      document.getElementById('route-tip').innerHTML = route.tip;

      const listEl = document.getElementById('route-steps-list');
      listEl.innerHTML = '';
      stops.forEach((spotKey, idx) => {
        const spot = SPOTS_DB[spotKey];
        const isCurrent = spotKey === currentSpotId;
        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-2 rounded-xl cursor-pointer transition border ${
          isCurrent
            ? 'bg-blue-600/35 border-amber-400 text-white'
            : 'bg-slate-800/70 border-slate-700/70 text-slate-300 hover:bg-slate-700/80'
        }`;
        item.innerHTML = `

            <span class="w-5 h-5 rounded-full bg-amber-500 text-slate-950 font-extrabold text-[11px] flex items-center justify-center shrink-0">${idx + 1}</span>

            </div>
          </div>
          <span class="text-[10px] text-amber-300 font-medium shrink-0 ml-1">飞往 ➔</span>
        `;
        item.addEventListener('click', () => selectSpotAndOpenGuide(spotKey));
        listEl.appendChild(item);

    const walkBtnToggle = document.getElementById('btn-walk-toggle');

    function evaluateWalkPose(t) {
      const eyeHeight = 1.68;
      const AX = ZX_OFFSET_X;

      if (t <= 0.88) {
        const u = t / 0.88;
        const z = THREE.MathUtils.lerp(18, -114, u);
        const groundY = getAxisElevation(z);

        let xOffset = 0;
        if (z < -34 && z > -48) {
          xOffset = Math.sin(((z - (-34)) / (-14)) * Math.PI) * 2.3;
        }

        const isOnStairs = (z < STAIR_START_Z && z > STAIR_END_Z);
        const stepBob = Math.sin(u * 135) * (isOnStairs ? 0.13 : 0.04);
        const camPos = new THREE.Vector3(AX + xOffset, groundY + eyeHeight + stepBob, z);

        const lookZ = Math.max(-130, z - 22);
        const lookGroundY = getAxisElevation(lookZ);
        const lookTarget = new THREE.Vector3(AX, lookGroundY + (isOnStairs ? 3.0 : 2.4), lookZ);
        return { camPos, lookTarget, z };
      } else {
        const turnU = (t - 0.88) / 0.12;
        const easeTurn = 1 - Math.pow(1 - turnU, 2);
        const camPos = new THREE.Vector3(
          AX + Math.sin(easeTurn * Math.PI) * 3.0,
          STAIR_END_Y + eyeHeight + easeTurn * 0.5,
          THREE.MathUtils.lerp(-114, -111, easeTurn)
        );
        const angle = easeTurn * Math.PI;
        const lookDist = 42;
        const lookTarget = new THREE.Vector3(
          AX + Math.sin(angle) * lookDist * 0.3,
          THREE.MathUtils.lerp(33.0, 6.0, easeTurn),
          camPos.z - Math.cos(angle) * lookDist
        );
        return { camPos, lookTarget, z: camPos.z };
      }
    }

    function applyWalkProgress(t) {
      walkT = THREE.MathUtils.clamp(t, 0, 1);
      const { camPos, lookTarget, z } = evaluateWalkPose(walkT);
      camera.position.copy(camPos);
      controls.target.copy(lookTarget);

      walkSlider.value = Math.round(walkT * 1000);
      walkPercent.textContent = `${Math.round(walkT * 100)}%`;

      let stageText = '当前位置：孝经鼎与博爱坊广场';
      let stepNum = 0;
      if (z > 4) { stageText = '穿过【博爱坊】石牌坊'; stepNum = 6; }
      else if (z > -22) { stageText = '漫步【墓道】苍松翠柏'; stepNum = 8 + Math.round(((4 - z) / 26) * 32); }
      else if (z > -34) { stageText = '穿过【陵门】天下为公'; stepNum = 40; }
      else if (z > -48) { stageText = '绕行【碑亭】赑屃功德碑'; stepNum = 54; }
      else if (z > -112 && walkT <= 0.88) {
        const r = (-48 - z) / 64;
        const pIdx = Math.min(10, Math.floor(r * 10) + 1);
        stageText = `攀登 392 级石阶 (第 ${pIdx}/10 段 · 仰视只见石阶)`;
        stepNum = Math.min(392, 54 + Math.round(r * 338));
      } else {
        stageText = '抵达【祭堂】双华表 · 回首俯瞰十层白玉平台';
        stepNum = 392;
      }
      walkStageLabel.textContent = stageText;
      walkStepCounter.textContent = `${stepNum} / 392 级`;
    }

    function setWalkPlaying(play) {
      isPlayingWalk = play;
      if (play) {
        camTween = null;
        if (walkT >= 0.995) walkT = 0;
        walkIcon.textContent = '⏸';
        walkBtnText.textContent = '暂停第一人称登陵漫游';
      } else {
        walkIcon.textContent = '▶';
        walkBtnText.textContent = walkT > 0 && walkT < 0.99 ? '继续第一人称登陵漫游' : '开启第一人称登陵漫游 (392级石阶)';
      }
    }

    walkBtnToggle.addEventListener('click', () => setWalkPlaying(!isPlayingWalk));
    walkSlider.addEventListener('input', (e) => {
      if (isPlayingWalk) setWalkPlaying(false);
      camTween = null;
      applyWalkProgress(parseFloat(e.target.value) / 1000);
    });

    // 初始化默认路线（showRoute3DLines = false，默认保持无连接线的清爽视野，点击顶部路线按钮时再显示 3D 连接线）
    rebuild3DRouteSpline('all', false);
    goToFullSandboxOverview();

    // ============================================================================
    // 18. 动画主循环与全域动态交通更新 (60FPS Main Loop)
    // ============================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      // 1. 更新飘落秋叶粒子
      const pos = leafGeo.attributes.position.array;
      for (let i = 0; i < LEAF_COUNT; i++) {
        const idx = i * 3;
        const v = leafVel[i];
        pos[idx] += Math.sin(elapsed * v.freq + v.phase) * v.amp;
        pos[idx + 1] -= v.vy;
        pos[idx + 2] += Math.cos(elapsed * v.freq * 0.8 + v.phase) * (v.amp * 0.7);
        if (pos[idx + 1] < 0.5) {
          pos[idx + 1] = 85 + Math.random() * 15;
          pos[idx] = (Math.random() - 0.5) * 660;
        }
      }
      leafGeo.attributes.position.needsUpdate = true;

      // 1B. 更新天空流云漂浮动画
      animatedClouds.forEach(cl => {
        cl.mesh.position.x += cl.speed * dt;
        cl.mesh.position.y = cl.baseY + Math.sin(elapsed * 0.45 + cl.phase) * 1.2;
        if (cl.mesh.position.x > 760) cl.mesh.position.x = -760;
      });

      // 1C. 更新全城主干道汽车、公交与景区行人动态
      animatedCityCars.forEach(car => {
        car.u = (car.u + car.speed * dt) % 1.0;
        car.mesh.position.lerpVectors(car.start, car.end, car.u);
      });

      animatedPedestrians.forEach(ped => {
        ped.u += ped.dir * ped.speed * dt;
        if (ped.u > 1.0) { ped.u = 1.0; ped.dir = -1; }
        if (ped.u < 0.0) { ped.u = 0.0; ped.dir = 1; }
        ped.mesh.position.lerpVectors(ped.p1, ped.p2, ped.u);
        ped.mesh.position.y += Math.abs(Math.sin(elapsed * 7.5 + ped.phase)) * 0.18;
      });

      // 2. 实时滚动长江与玄武湖“波光粼粼”水波纹理 + 律动 1600 颗江面碎金闪烁粒子
      yangtzeShimmerTex.offset.x = (elapsed * 0.085) % 1.0;
      yangtzeShimmerTex.offset.y = Math.sin(elapsed * 0.6) * 0.04;
      lakeShimmerTex.offset.x = (elapsed * 0.045) % 1.0;
      lakeShimmerTex.offset.y = Math.cos(elapsed * 0.5) * 0.03;

      if (yangtzeSparkleGeo && yangtzeSparkleData.length > 0) {
        const spArr = yangtzeSparkleGeo.attributes.position.array;
        for (let i = 0; i < yangtzeSparkleData.length; i++) {
          const d = yangtzeSparkleData[i];
          d.u = (d.u + d.speed * dt) % 1.0;
          const pt = YANGTZE_MAIN_CURVE.getPointAt(d.u);
          const tan = YANGTZE_MAIN_CURVE.getTangentAt(d.u).normalize();
          const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
          const hw = getYangtzeHalfWidth(d.u) * 0.86;
          const p = pt.clone().addScaledVector(normal, d.latRatio * hw);
          spArr[i * 3]     = p.x;
          spArr[i * 3 + 1] = 0.42 + Math.sin(elapsed * 4.5 + i) * 0.12;
          spArr[i * 3 + 2] = p.z;
        }
        yangtzeSparkleGeo.attributes.position.needsUpdate = true;
      }

      // 2B. 更新半圆弧形长江 (YANGTZE_MAIN_CURVE) 上实时巡航的 11 艘豪华游轮与万吨货轮
      animatedShips.forEach(s => {
        s.u += s.dir * s.speed * dt;
        if (s.u > 0.98) s.u = 0.02;
        if (s.u < 0.02) s.u = 0.98;
        const pt = YANGTZE_MAIN_CURVE.getPointAt(s.u);
        const tan = YANGTZE_MAIN_CURVE.getTangentAt(s.u).normalize();
        const normal = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
        // 在江心洲段 (u < 0.28) 走西侧主航道，北段与栖霞山段走航道中心两侧分道线
        const latOffset = s.u < 0.28 ? s.lat : (s.dir > 0 ? 15 : -15);
        s.mesh.position.copy(pt).addScaledVector(normal, latOffset);
        s.mesh.position.y = 0;
        const heading = tan.clone().multiplyScalar(s.dir);
        s.mesh.rotation.y = Math.atan2(-heading.z, heading.x);
      });

      if (bridgeTrainGroup) {
        bridgeTrainGroup.position.z += 28 * dt;
        if (bridgeTrainGroup.position.z > -260) bridgeTrainGroup.position.z = -380;
      }

      animatedBridgeCars.forEach(c => {
        c.mesh.position.z += c.dir * c.speed * dt;
        if (c.dir > 0 && c.mesh.position.z > -225) c.mesh.position.z = -405;
        if (c.dir < 0 && c.mesh.position.z < -405) c.mesh.position.z = -225;
      });

      animatedFifthBridgeCars.forEach(fc => {
        fc.mesh.position.x += fc.dir * fc.speed * dt;
        if (fc.dir > 0 && fc.mesh.position.x > -265) fc.mesh.position.x = -500;
        if (fc.dir < 0 && fc.mesh.position.x < -500) fc.mesh.position.x = -265;
      });

      // 2B. 更新南京南站复兴号/和谐号高铁与禄口国际机场起降客机、雷达旋转
      animatedHSRTrains.forEach(tr => {
        tr.mesh.position.x += tr.dir * tr.speed * dt;
        if (tr.dir > 0 && tr.mesh.position.x > 112) tr.mesh.position.x = -112;
        if (tr.dir < 0 && tr.mesh.position.x < -112) tr.mesh.position.x = 112;
      });

      if (radarDishMesh) {
        radarDishMesh.rotation.y = elapsed * 2.2;
      }

      animatedAirplanes.forEach(ap => {
        const u = ((elapsed * 0.11) + ap.phase) % 1.0;
        if (ap.mode === 'takeoff') {
          // 从西向东滑跑并在跑道中后段拉升起飞直冲云霄
          const x = -92 + u * 210;
          const lift = u < 0.48 ? 0 : Math.pow((u - 0.48) / 0.52, 1.8) * 38;
          const pitch = u < 0.45 ? 0 : Math.min(0.32, (u - 0.45) * 0.85);
          ap.mesh.position.set(x, 0.65 + lift, ap.rz);
          ap.mesh.rotation.z = pitch;
        } else {
          // 从东侧高空下滑进近、接地滑跑减速
          const x = 92 - u * 210;
          const alt = u < 0.52 ? Math.pow((0.52 - u) / 0.52, 1.6) * 34 : 0;
          const pitch = u < 0.50 ? -0.14 : 0;
          ap.mesh.position.set(x, 0.65 + alt, ap.rz);
          ap.mesh.rotation.z = pitch;
        }
      });

      // 3. 更新玄武湖游船与夫子庙秦淮画舫
      animatedLakeBoats.forEach(b => {
        const t = elapsed * b.speed + b.phase;
        b.mesh.position.set(b.cx + Math.cos(t) * b.rx, 0.25, b.cz + Math.sin(t) * b.rz);
        b.mesh.rotation.y = Math.atan2(-Math.sin(t) * b.rx * b.speed, Math.cos(t) * b.rz * b.speed);
      });

      animatedQinhuaiBoats.forEach(qb => {
        qb.offsetX += qb.dir * qb.speed * dt;
        if (qb.dir > 0 && qb.offsetX > 48) qb.offsetX = -48;
        if (qb.dir < 0 && qb.offsetX < -48) qb.offsetX = 48;
        qb.mesh.position.x = qb.baseX + qb.offsetX;
      });

      // 4. 更新 3D 攻略路线上的流光脉冲球
      if (activeRouteCurve && routePulseMeshes.length > 0) {
        routePulseMeshes.forEach(item => {
          const u = (item.offset + elapsed * 0.075) % 1.0;
          const pt = activeRouteCurve.getPointAt(u);
          item.mesh.position.copy(pt);
        });
      }

      // 5. 更新相机漫游或平滑飞行插值
      if (isPlayingWalk) {
        const nextT = walkT + dt / WALK_DURATION;
        if (nextT >= 1.0) {
          applyWalkProgress(1.0);
          setWalkPlaying(false);
        } else {
          applyWalkProgress(nextT);
        }
      } else if (camTween) {
        camTween.progress += dt * 1.45;
        const t = Math.min(1, camTween.progress);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camTween.startPos, camTween.endPos, ease);
        controls.target.lerpVectors(camTween.startLook, camTween.endLook, ease);
        if (t >= 1) camTween = null;
      }

      controls.update();
      update3DMapPins();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
